<style>

/*************************************************
 * User Management V2
 *************************************************/

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  background:#f8fafc;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color:#0f172a;
}

.hidden{
  display:none!important;
}

/*************************************************
 * Container
 *************************************************/

.page-container{
  max-width:1400px;
  margin:auto;
  padding:20px;
}

/*************************************************
 * Title
 *************************************************/

.page-title-bar{
  margin-bottom:24px;
}

.page-title{
  display:flex;
  align-items:center;
  gap:10px;

  font-size:32px;
  font-weight:800;

  margin:0;
}

.page-desc{
  margin-top:6px;
  color:#64748b;
  font-size:14px;
}

/*************************************************
 * KPI
 *************************************************/

.kpi-grid{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:18px;
  margin-bottom:20px;
}

.kpi-card{
  background:#fff;
  border-radius:16px;
  padding:14px 16px;
  min-height:auto;      /* 不固定高度 */
  box-shadow:
    0 4px 10px rgba(15,23,42,.05);
}

.kpi-card:hover{
  transform:translateY(-2px);
}

.kpi-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}

.kpi-title{
  font-size:13px;
  color:#64748b;
  font-weight:600;
}

.kpi-icon{
  width:40px;
  height:40px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eff6ff;
  font-size:20px;
}

.kpi-value{
  font-size:26px;
  line-height:1.1;
  font-weight:800;
  color:#0f172a;
}

.kpi-unit{
  margin-top:4px;
  font-size:12px;
  color:#94a3b8;
}

/*************************************************
 * Search
 *************************************************/

.toolbar{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:16px;
}

.search-input{
  flex:1;
  height:44px;
  border:1px solid #cbd5e1;
  border-radius:12px;
  padding:0 14px;
  background:#fff;
}

.search-input:focus{
  outline:none;
  border-color:#2563eb;
  box-shadow:
    0 0 0 3px rgba(37,99,235,.12);
}

.toolbar select{
  width:160px;
  height:44px;
  border-radius:12px;
  border:1px solid #cbd5e1;
  background:#fff;
  padding:0 12px;
}

/*************************************************
 * Filter
 *************************************************/

.filter-card{
  background:#fff;
  border-radius:18px;
  padding:14px 18px;
  margin-bottom:18px;
  box-shadow:
    0 4px 12px rgba(15,23,42,.05);
}

.filter-card label{
  display:inline-flex;
  align-items:center;
  margin-right:18px;
  cursor:pointer;
  font-size:14px;
  color:#334155;
}

/*************************************************
 * Action Toolbar
 *************************************************/

.toolbar-action{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.toolbar-left,
.toolbar-right{
  display:flex;
  gap:10px;
}

/*************************************************
 * Buttons
 *************************************************/

.btn-primary{
  border:none;
  padding:10px 18px;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-weight:700;
  cursor:pointer;
  box-shadow:
    0 4px 12px rgba(37,99,235,.25);
}

.btn-primary:hover{
  background:#1d4ed8;
}

.btn-outline{
  border:1px solid #cbd5e1;
  background:#fff;
  border-radius:10px;
  padding:8px 12px;
  cursor:pointer;
}

/*************************************************
 * Table Card
 *************************************************/

.table-panel{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:
    0 4px 14px rgba(15,23,42,.05);
}

.table-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
  background:
  linear-gradient(
    90deg,
    #0f172a,
    #1e3a8a
  );

  color:#fff;
}

.table-title{
  font-size:18px;
  font-weight:800;
}

.table-count{
  font-size:13px;
  color:#cbd5e1;
}

.table-wrapper{
  overflow-x:auto;
}

/*************************************************
 * Table
 *************************************************/

.user-table{
  width:100%;
  border-collapse:collapse;
}

.user-table th{
  background:#f8fafc;
  padding:12px;
  text-align:left;
  font-size:13px;
  color:#475569;
  font-weight:700;
  border-bottom:
    1px solid #e2e8f0;
}

.user-table td{
  padding:14px 12px;
  vertical-align:top;
  border-bottom:
    1px solid #e2e8f0;
}

.user-table tbody tr:hover{
  background:#f8fafc;
}

/*************************************************
 * User Name
 *************************************************/

.tb-name{

  font-size:15px;

  font-weight:700;

  color:#0f172a;
}

.tb-account{
  margin-top:3px;
  font-size:12px;
  color:#64748b;
}

/*************************************************
 * Role Badge
 *************************************************/

.table-badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.role-badge{
  display:inline-flex;
  align-items:center;
  height:28px;
  padding:0 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.role-judge{
  background:#dbeafe;
  color:#1d4ed8;
}

.role-chief-judge{
  background:#fef3c7;
  color:#92400e;
}

.role-record{
  background:#ede9fe;
  color:#6d28d9;
}

.role-record-chief{
  background:#ddd6fe;
  color:#5b21b6;
}

.role-admin{
  background:#fee2e2;
  color:#991b1b;
}

/*************************************************
 * Status
 *************************************************/

.status-badge{
  display:inline-flex;
  justify-content:center;
  align-items:center;
  min-width:60px;
  height:28px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.status-active{
  background:#dcfce7;
  color:#166534;
}

.status-active::before{
  content:"●";
  margin-right:4px;
}

.status-disable{
  background:#fee2e2;
  color:#991b1b;
}

/*************************************************
 * Attendance
 *************************************************/

.attendance-cell{
  min-width:90px;
}

.attendance-count{
  font-weight:700;
}

.attendance-rate{
  font-size:12px;
  color:#16a34a;
}

/*************************************************
 * Action Buttons
 *************************************************/

.action-col{
  white-space:nowrap;
}

.action-btn{
  font-size:15px;
  width:36px;
  height:36px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  transition:.2s;
}

.action-btn:hover{
  transform:translateY(-1px);
}

.action-btn.stat{
  background:#dbeafe;
}

.action-btn.edit{
  background:#ffedd5;
}

.action-btn.password{
  background:#fef9c3;
}

.action-btn.delete{
  background:#fee2e2;
}

/*************************************************
 * RWD
 *************************************************/

@media(max-width:768px){

  .page-container{
    padding:14px;
  }

  .kpi-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .toolbar{
    flex-direction:column;
    align-items:stretch;
  }

  .toolbar-action{
    flex-direction:column;
    gap:10px;
    align-items:stretch;
  }

  .toolbar-right{
    flex-wrap:wrap;
  }
}
  
</style>

<script src="js/auth.js"></script>

<script>

// 全域變數

/*********************************************************
 * User V3 全域篩選條件
 *********************************************************/
let currentKeyword = '';
let currentRoleFilter = 'all';
let allUsers = [];
let pendingUserUpdates = {};

/*********************************************************
 * User V3 Render
 *********************************************************/
function renderAll(){
  updateKpi();
  renderUserTable();
}

/*********************************************************
 * Search / Filter Event
 *********************************************************/
document.addEventListener(
  'DOMContentLoaded',
  ()=>{

    loadHeader();
    loadUsers();

    const txtSearch =
      document.getElementById(
        'txtSearch'
      );

    if(txtSearch){

      txtSearch.addEventListener(
        'input',
        applyFilter
      );

    }

    document
      .querySelectorAll(
        'input[name="roleFilter"]'
      )
      .forEach(r=>{

        r.addEventListener(
          'change',
          applyFilter
        );

      });

  }
);

// 載入共同 Header
// 處理角色切換
// 顯示登入者名稱
  
  function loadHeader() {
    fetch('header.html')
      .then(r => r.text())
      .then(html => {
        const hc = document.getElementById('header-container');
        if (!hc) return;
  
        hc.innerHTML = html;
  
        // ✅ 一律從 session 重新設定 role（唯一正解）
        const session = (typeof getSession === 'function')
          ? getSession()
          : JSON.parse(localStorage.getItem('session_user') || '{}');
  
        document.body.classList.remove(
          'role-admin',
          'role-judge',
          'role-record'
        );
  
        if (session && session.role) {
          const roles = session.role.split(',').map(r => r.trim());
  
          if (roles.includes('admin')) {
            document.body.classList.add('role-admin');
          }
          if (roles.includes('judge') || roles.includes('chief_judge')) {
            document.body.classList.add('role-judge');
          }
          if (roles.includes('record') || roles.includes('record_chief')) {
            document.body.classList.add('role-record');
          }
        }
  
        // ✅ 顯示登入者姓名
        if (session && session.name) {
          const nameEl = document.getElementById('header-username');
          if (nameEl) nameEl.textContent = session.name;
        }
      })
      .catch(err => console.error('Header 載入失敗', err));
  }

// 日期時間格式正規化
function formatDateTime(v){

  if(!v){
    return '-';
  }

  const d = new Date(v);

  if(isNaN(d)){
    return '-';
  }

  return d.toLocaleString(
    'zh-TW'
  );

}
  
// 讀取 Users
function loadUsers(){
  callApi({action:'getUsers'}, res => {
    if (!res || res.result === 'error') {
      showToast(res?.message || '載入使用者失敗','error');
      return;
    }
    allUsers = res.users || [];
    renderAll();
  });
}

// 啟用 / 停用帳號
// ===== 帳號狀態 =====
function toggleActive(userId, checked) {
  callApi(
    {
      action: 'toggleUserActive',
      user_id: userId,
      active: checked ? 1 : 0
    },
    function (res) {
      if (res && res.result === 'error') {
        showToast(res.message || '狀態更新失敗', 'error');
        return;
      }
      showToast('狀態已更新', 'success');
      loadUsers(); // 重載以同步各清單顯示
    }
  );
}

/*********************************************************
 * 暫存修改內容
 * V2 舊版 Inline Edit
 * 保留供未來 Modal 編輯使用
 *********************************************************/
function markField(uid,key,val){
  
  console.log('[markField]', uid, key, val);

  if(!pendingUserUpdates[uid]) pendingUserUpdates[uid]={};
  pendingUserUpdates[uid][key]=val;
}

/*********************************************************
 * 變更身份
 * V2 舊版 Inline Edit
 * 保留供未來 Modal 編輯使用
 *********************************************************/
function toggleRole(uid,role,on){
  
  console.log('[toggleRole]', uid, role, on);

  const u=allUsers.find(x=>x.user_id==uid);
  let roles=(u.role||'').split(',').filter(Boolean);
  roles=roles.filter(r=>r!==role);
  if(on) roles.push(role);
  const rStr=roles.join(',');
  u.role=rStr;
  if(!pendingUserUpdates[uid]) pendingUserUpdates[uid]={};
  pendingUserUpdates[uid].role=rStr;
}

/*********************************************************
 * 裁判及紀錄等級
 * V2 舊版 Inline Edit
 * 保留供未來 Modal 編輯使用
 *********************************************************/
function setLevel(uid, type, val) {
  const u = allUsers.find(x => x.user_id == uid);
  if (!u) return;

  // 現有 level 拆開
  const [judgeLv = 'N', recordLv = 'N'] = (u.level || 'N,N').split(',');

  // 改其中一個
  const newJudgeLv = (type === 'judge') ? val : judgeLv;
  const newRecordLv = (type === 'record') ? val : recordLv;

  const newLevel = `${newJudgeLv},${newRecordLv}`;

  // ✅ 更新前端狀態
  u.level = newLevel;

  if (!pendingUserUpdates[uid]) pendingUserUpdates[uid] = {};
  pendingUserUpdates[uid].level = newLevel;

  console.log('[setLevel merged]', uid, newLevel);
}
  
/*********************************************************
 * 實際寫入 Users
 * V2 舊版 Inline Edit
 * 保留供未來 Modal 編輯使用
 *********************************************************/
function saveUser(uid) {
  console.log('✅ saveUser triggered:', uid);

  const data = pendingUserUpdates[uid];

  if (!data || Object.keys(data).length === 0) {
    showToast('尚未修改','warn');
    return;
  }

  const entries = Object.entries(data);
  let finished = 0;
  let hasError = false;

  entries.forEach(([field, value]) => {
    callApi(
      {
        action: 'updateUserField',
        user_id: uid,
        field,
        value
      },
      function(res) {
        console.log('[updateUserField]', uid, field, value, res);

        if (res && res.result === 'error') {
          hasError = true;
          showToast(res.message || `更新 ${field} 失敗`,'error');
        }

        finished++;

        if (finished === entries.length && !hasError) {
          showToast('儲存成功','success');
          pendingUserUpdates[uid] = {};
          loadUsers();
        }
      }
    );
  });
}

// 刪除帳號
function deleteUser(uid, username) {
  if (!confirm(`確定要刪除使用者「${username}」？`)) return;

  const currentUserId = localStorage.getItem('user_id') || '';

  callApi(
    {
      action: 'deleteUsers',          // ✅ 對齊後端
      user_ids: uid,                  // ✅ 對齊後端（逗號字串）
      current_user_id: currentUserId  // ✅ 後端需要
    },
    function(res) {

      console.log('[deleteUsers response]', res);

      if (res && res.result === 'error') {
        showToast(res.message || '刪除失敗','error');
        return;
      }

      showToast(res.message || '刪除成功','success');
      loadUsers();
    }
  );
}

// 提示訊息
function showToast(msg, type='success') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.body.appendChild(t);

  setTimeout(()=>t.classList.add('show'),10);

  setTimeout(()=>{
    t.classList.remove('show');
    setTimeout(()=>t.remove(),300);
  },2000);
}

/*********************************************************
 * Dashboard KPI
 *
 * 更新：
 * 1. 帳號總數
 * 2. 裁判總數
 * 3. 紀錄總數
 * 4. 停用帳號
 *********************************************************/
function updateKpi(){

  const totalUsers =
    allUsers.length;

  const judges =
    allUsers.filter(u => {

      const role =
        String(u.role || '');

      return (
        role.includes('judge')
        ||
        role.includes('chief_judge')
      );

    }).length;

  const records =
    allUsers.filter(u => {

      const role =
        String(u.role || '');

      return (
        role.includes('record')
        ||
        role.includes('record_chief')
      );

    }).length;

  const disabled =
    allUsers.filter(u =>
      Number(u.active || 0) === 0
    ).length;

  const setText = (id,val)=>{

    const el =
      document.getElementById(id);

    if(el){
      el.textContent = val;
    }

  };

  setText(
    'kpiTotalUsers',
    totalUsers
  );

  setText(
    'kpiJudgeUsers',
    judges
  );

  setText(
    'kpiRecordUsers',
    records
  );

  setText(
    'kpiDisabledUsers',
    disabled
  );

}

/*********************************************************
 * 依畫面條件取得過濾後資料
 *********************************************************/
function getFilteredUsers(){

  return allUsers.filter(u => {

    const keyword =
      currentKeyword
        .trim()
        .toLowerCase();

    const searchArea = [
      u.username,
      u.name,
      u.note,
      u.email,
      u.phone
    ]
    .join(' ')
    .toLowerCase();

    const hitKeyword =
      !keyword ||
      searchArea.includes(keyword);

    const role =
      String(u.role || '');

    const hitRole =
      currentRoleFilter === 'all'
      ||
      role.includes(
        currentRoleFilter
      );

    return (
      hitKeyword &&
      hitRole
    );

  });

}


/*********************************************************
 * 證照等級顯示
 *********************************************************/
function displayLevel(v){

  if(!v || v === 'N'){
    return '無';
  }

  return v;

}


/*********************************************************
 * User V3 主表格
 *********************************************************/
function renderUserTable(){

  const tbody =
    document.getElementById(
      'userTableBody'
    );

  if(!tbody){
    return;
  }

  const users =
    getFilteredUsers();

  tbody.innerHTML = '';

  users.forEach(u => {

    const tr =
      document.createElement('tr');

    const roles =
      String(u.role || '')
        .split(',');

    const [judgeLv,recordLv] =
      splitLevel(
        u.level || 'N,N'
      );

    const roleBadges = [];

    if(roles.includes('judge')){
      roleBadges.push(
        '<span class="role-badge role-judge">裁判</span>'
      );
    }

    if(roles.includes('chief_judge')){
      roleBadges.push(
        '<span class="role-badge role-chief-judge">裁判長</span>'
      );
    }

    if(roles.includes('record')){
      roleBadges.push(
        '<span class="role-badge role-record">紀錄</span>'
      );
    }

    if(roles.includes('record_chief')){
      roleBadges.push(
        '<span class="role-badge role-record-chief">紀錄長</span>'
      );
    }

    if(roles.includes('admin')){
      roleBadges.push(
        '<span class="role-badge role-admin">管理員</span>'
      );
    }

    const activeClass =
      Number(u.active || 0) === 1
        ? 'status-active'
        : 'status-disable';

    const activeText =
      Number(u.active || 0) === 1
        ? '啟用'
        : '停用';

    tr.innerHTML = `

      <td>
        ${u.note || '-'}
      </td>

      <td>

        <div class="tb-name">
          ${u.name || '-'}
        </div>

        <div class="tb-account">
          ${u.username || ''}
        </div>

      </td>

      <td>

        <div class="table-badges">
          ${roleBadges.join('')}
        </div>

      </td>

      <td>

        <div>
          🏅 ${displayLevel(judgeLv)}
        </div>

        <div>
          📝 ${displayLevel(recordLv)}
        </div>

      </td>

      <td>
      
        <div class="attendance-cell">
      
          <div class="attendance-count">
            ${u.exp_total || 0} 場
          </div>
      
          <div class="attendance-rate">
            完成率 ${u.completed_rate || 0}%
          </div>
      
        </div>
      
      </td>
  
      <td>
      
        <div class="attendance-count">
          ${u.quality_score || 0}
        </div>
      
        <div
          style="
            font-size:12px;
            color:#64748b;
          ">
      
          評分 ${u.final_score || 0}
      
        </div>
      
      </td>

      <td>
      
        <div>
          📧 ${u.email || '-'}
        </div>
      
        <div>
          📱 ${u.phone || '-'}
        </div>
      
      </td>

      <td>

        <span class="status-badge ${activeClass}">
          ${activeText}
        </span>

      </td>
      
      <td>
        ${formatDateTime(u.last_login)}
      </td>


      <td class="action-col">

        <button
          class="action-btn stat"
          title="個人統計"
          onclick="showUserStatistics('${u.user_id}')">
        
          📊
        
        </button>

        <button
          class="action-btn edit"
          title="編輯資料"
          onclick="openEditUserModal('${u.user_id}')">

          ✏️

        </button>

        <button
          class="action-btn password"
          title="重設密碼"
          onclick="resetPassword('${u.user_id}')">
        
          🔑
        
        </button>

        <button
          class="action-btn delete"
          title="刪除使用者"
          onclick="deleteUser('${u.user_id}','${u.username}')">

          🗑

        </button>

      </td>

    `;

    tbody.appendChild(tr);

  });

  const countBox =
    document.getElementById(
      'tableCount'
    );

  if(countBox){
    countBox.textContent =
      `共 ${users.length} 筆`;
  }

}

/*********************************************************
 * 套用搜尋與身份篩選
 *********************************************************/
function applyFilter(){

  const keywordBox =
    document.getElementById(
      'txtSearch'
    );

  if(keywordBox){
    currentKeyword =
      keywordBox.value || '';
  }

  const checkedRole =
    document.querySelector(
      'input[name="roleFilter"]:checked'
    );

  if(checkedRole){
    currentRoleFilter =
      checkedRole.value;
  }

  renderUserTable();

}


/*********************************************************
 * 個人統計
 *********************************************************/
function showUserStatistics(userId){

  const user =
    allUsers.find(
      u => String(u.user_id) === String(userId)
    );

  if(!user){
    showToast('找不到使用者','error');
    return;
  }

  alert(
`
姓名：${user.name || '-'}

帳號：${user.username || '-'}

總經驗：
${user.exp_total || 0}

裁判經驗：
${user.exp_judge || 0}

紀錄經驗：
${user.exp_record || 0}

完成率：
${user.completed_rate || 0}%

遲到率：
${user.late_rate || 0}%

缺席率：
${user.no_show_rate || 0}%

品質分數：
${user.quality_score || 0}

總評分：
${user.final_score || 0}
`
  );

}


/*********************************************************
 * 重設密碼
 *********************************************************/
function resetPassword(userId){

  if(
    !confirm(
      '確定重設此帳號密碼？'
    )
  ){
    return;
  }

  callApi(
    {
      action:'changePassword',
      user_id:userId,
      new_password:'0000'
    },
    res => {

      if(
        !res ||
        res.result === 'error'
      ){
        showToast(
          res?.message || '重設失敗',
          'error'
        );
        return;
      }

      showToast(
        '密碼已重設為 0000',
        'success'
      );

    }
  );

}

/*********************************************************
 * 編輯使用者
 *********************************************************/
function openEditUserModal(userId){

  const user =
    allUsers.find(
      u => String(u.user_id) === String(userId)
    );

  if(!user){
    showToast('找不到使用者','error');
    return;
  }

  alert(
`
姓名：
${user.name || '-'}

帳號：
${user.username || '-'}

Email：
${user.email || '-'}

電話：
${user.phone || '-'}
`
  );

}


</script>
