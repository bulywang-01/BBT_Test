<style>

/*************************************************
 * User Management V2
 *************************************************/

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0;
  background:#f8fafc;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color:#0f172a;
}

.hidden{
  display:none!important;
}

/*************************************************
 * Container
 *************************************************/

.page-container{
  max-width:1400px;
  margin:auto;
  padding:20px;
}

/*************************************************
 * Title
 *************************************************/

.page-title-bar{
  margin-bottom:24px;
}

.page-title{
  display:flex;
  align-items:center;
  gap:10px;

  font-size:32px;
  font-weight:800;

  margin:0;
}

.page-desc{
  margin-top:6px;
  color:#64748b;
  font-size:14px;
}

/*************************************************
 * KPI
 *************************************************/

.kpi-grid{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:18px;
  margin-bottom:20px;
}

.kpi-card{
  background:#fff;
  border-radius:16px;
  padding:14px 16px;
  min-height:auto;      /* 不固定高度 */
  box-shadow:
    0 4px 10px rgba(15,23,42,.05);
}

.kpi-card:hover{
  transform:translateY(-2px);
}

.kpi-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:6px;
}

.kpi-title{
  font-size:13px;
  color:#64748b;
  font-weight:600;
}

.kpi-icon{
  width:40px;
  height:40px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eff6ff;
  font-size:20px;
}

.kpi-value{
  font-size:28px;
  font-weight:800;
  color:#0f172a;
}

.kpi-unit{
  margin-top:4px;
  font-size:12px;
  color:#94a3b8;
}

/*************************************************
 * Search
 *************************************************/

.toolbar{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:16px;
}

.search-input{
  flex:1;
  height:44px;
  border:1px solid #cbd5e1;
  border-radius:12px;
  padding:0 14px;
  background:#fff;
}

.search-input:focus{
  outline:none;
  border-color:#2563eb;
  box-shadow:
    0 0 0 3px rgba(37,99,235,.12);
}

.toolbar select{
  width:160px;
  height:44px;
  border-radius:12px;
  border:1px solid #cbd5e1;
  background:#fff;
  padding:0 12px;
}

/*************************************************
 * Filter
 *************************************************/

.filter-card{
  background:#fff;
  border-radius:18px;
  padding:14px 18px;
  margin-bottom:18px;
  box-shadow:
    0 4px 12px rgba(15,23,42,.05);
}

.filter-card label{
  display:inline-flex;
  align-items:center;
  margin-right:18px;
  cursor:pointer;
  font-size:14px;
  color:#334155;
}

/*************************************************
 * Action Toolbar
 *************************************************/

.toolbar-action{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.toolbar-left,
.toolbar-right{
  display:flex;
  gap:10px;
}

/*************************************************
 * Buttons
 *************************************************/

.btn-primary{
  border:none;
  padding:10px 18px;
  border-radius:12px;
  background:#2563eb;
  color:#fff;
  font-weight:700;
  cursor:pointer;
  box-shadow:
    0 4px 12px rgba(37,99,235,.25);
}

.btn-primary:hover{
  background:#1d4ed8;
}

.btn-outline{
  border:1px solid #cbd5e1;
  background:#fff;
  border-radius:10px;
  padding:8px 12px;
  cursor:pointer;
}

/*************************************************
 * Table Card
 *************************************************/

.table-panel{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:
    0 4px 14px rgba(15,23,42,.05);
}

.table-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
  background:
  linear-gradient(
    90deg,
    #0f172a,
    #1e3a8a
  );

  color:#fff;
}

.table-title{
  font-size:16px;
  font-weight:800;
}

.table-count{
  font-size:13px;
  color:#cbd5e1;
}

.table-wrapper{
  overflow-x:auto;
}

/*************************************************
 * Table
 *************************************************/

.user-table{
  width:100%;
  border-collapse:collapse;
}

.user-table th{
  background:#f8fafc;
  padding:12px;
  text-align:left;
  font-size:13px;
  color:#475569;
  font-weight:700;
  border-bottom:
    1px solid #e2e8f0;
}

.user-table td{
  padding:14px 12px;
  vertical-align:top;
  border-bottom:
    1px solid #e2e8f0;
}

.user-table tbody tr:hover{
  background:#f8fafc;
}

/*************************************************
 * User Name
 *************************************************/

.tb-name{

  font-size:15px;

  font-weight:700;

  color:#0f172a;
}

.tb-account{
  margin-top:3px;
  font-size:12px;
  color:#64748b;
}

/*************************************************
 * Role Badge
 *************************************************/

.table-badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.role-badge{
  display:inline-flex;
  align-items:center;
  height:28px;
  padding:0 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.role-judge{
  background:#dbeafe;
  color:#1d4ed8;
}

.role-chief-judge{
  background:#fef3c7;
  color:#92400e;
}

.role-record{
  background:#ede9fe;
  color:#6d28d9;
}

.role-record-chief{
  background:#ddd6fe;
  color:#5b21b6;
}

.role-admin{
  background:#fee2e2;
  color:#991b1b;
}

/*************************************************
 * Status
 *************************************************/

.status-badge{
  display:inline-flex;
  justify-content:center;
  align-items:center;
  min-width:60px;
  height:28px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.status-active{
  background:#dcfce7;
  color:#166534;
}

.status-disable{
  background:#fee2e2;
  color:#991b1b;
}

/*************************************************
 * Attendance
 *************************************************/

.attendance-cell{
  min-width:90px;
}

.attendance-count{
  font-weight:700;
}

.attendance-rate{
  font-size:12px;
  color:#16a34a;
}

/*************************************************
 * Action Buttons
 *************************************************/

.action-col{
  white-space:nowrap;
}

.action-btn{

  width:36px;
  height:36px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  transition:.2s;
}

.action-btn:hover{

  transform:translateY(-1px);
}

.action-btn.stat{
  background:#dbeafe;
}

.action-btn.edit{
  background:#ffedd5;
}

.action-btn.password{
  background:#fef9c3;
}

.action-btn.delete{
  background:#fee2e2;
}

/*************************************************
 * RWD
 *************************************************/

@media(max-width:768px){

  .page-container{
    padding:14px;
  }

  .kpi-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .toolbar{
    flex-direction:column;
    align-items:stretch;
  }

  .toolbar-action{
    flex-direction:column;
    gap:10px;
    align-items:stretch;
  }

  .toolbar-right{
    flex-wrap:wrap;
  }
}
  
</style>
<body>

<div id="header-container"></div>

<div class="page-container">

  <!-- ===================================================== -->
  <!-- 標題 -->
  <!-- ===================================================== -->

  <section class="page-title-bar">

    <div>

      <h1 class="page-title">

  <!-- ===================================================== -->

    <div class="kpi-card judge">

  <!-- ===================================================== -->
  <!-- 功能列 -->
  <!-- ===================================================== -->

  <section class="toolbar-action">

    <div class="toolbar-left">

      <button
        class="btn-primary"

        ＋ 新增使用者
      </button>

    </div>

    <div class="toolbar-right">

      <button class="btn-outline">

  <!-- ===================================================== -->

  <section class="table-panel">

      <div

    </div>

    <div class="table-wrapper">

      <table class="user-table">

        <thead>

          <tr>

        <tbody id="userTableBody">

                </div>

              </div>

            </td>

            <td>

              <div>
                📧 aaa@gmail.com

              <div>

            <td>

    </div>

  </section>

</div>

</body>
