<body>

<div id="header-container"></div>

<div class="page-container">

  <!-- ===================================================== -->
  <!-- 標題 -->
  <!-- ===================================================== -->

  <section class="page-title-bar">

    <div>

      <h1 class="page-title">
        👥 人員管理中心
      </h1>

      <div class="page-desc">
        建立、維護與管理系統使用者資料
      </div>

    </div>

  </section>


  <!-- ===================================================== -->
  <!-- KPI -->
  <!-- ===================================================== -->

  <section class="kpi-grid">

    <div class="kpi-card total">

      <div class="kpi-top">

        <div class="kpi-title">
          帳號總數
        </div>

        <div class="kpi-icon">
          👥
        </div>

      </div>

      <div class="kpi-value" id="kpiTotalUsers">
        74
      </div>

      <div class="kpi-unit">
        人
      </div>

    </div>


    <div class="kpi-card judge">

      <div class="kpi-top">

        <div class="kpi-title">
          裁判總人數
        </div>

        <div class="kpi-icon">
          🏅
        </div>

      </div>

      <div class="kpi-value" id="kpiJudgeUsers">
        41
      </div>

      <div class="kpi-unit">
        人
      </div>

    </div>


    <div class="kpi-card record">

      <div class="kpi-top">

        <div class="kpi-title">
          紀錄總人數
        </div>

        <div class="kpi-icon">
          📝
        </div>

      </div>

      <div class="kpi-value" id="kpiRecordUsers">
        38
      </div>

      <div class="kpi-unit">
        人
      </div>

    </div>


    <div class="kpi-card disable">

      <div class="kpi-top">

        <div class="kpi-title">
          停用帳號數
        </div>

        <div class="kpi-icon">
          🚫
        </div>

      </div>

      <div class="kpi-value" id="kpiDisabledUsers">
        3
      </div>

      <div class="kpi-unit">
        人
      </div>

    </div>

  </section>


  <!-- ===================================================== -->
  <!-- 搜尋 -->
  <!-- ===================================================== -->

  <section class="toolbar">

    <input
      id="txtSearch"
      class="search-input"
      type="text"
      placeholder="搜尋帳號、姓名、背號、Email..."
    >

    <select id="roleFilterSelect">

      <option value="">
        全部身份
      </option>

      <option value="judge">
        裁判
      </option>

      <option value="record">
        紀錄
      </option>

      <option value="chief_judge">
        裁判長
      </option>

      <option value="record_chief">
        紀錄長
      </option>

      <option value="admin">
        管理員
      </option>

    </select>

  </section>


  <!-- ===================================================== -->
  <!-- 身份篩選 -->
  <!-- ===================================================== -->

  <section class="filter-card">

    <label>
      <input
        type="radio"
        name="roleFilter"
        value="all"
        checked
      >
      全部
    </label>

    <label>
      <input
        type="radio"
        name="roleFilter"
        value="judge"
      >
      裁判
    </label>

    <label>
      <input
        type="radio"
        name="roleFilter"
        value="record"
      >
      紀錄
    </label>

    <label>
      <input
        type="radio"
        name="roleFilter"
        value="chief_judge"
      >
      裁判長
    </label>

    <label>
      <input
        type="radio"
        name="roleFilter"
        value="record_chief"
      >
      紀錄長
    </label>

    <label>
      <input
        type="radio"
        name="roleFilter"
        value="admin"
      >
      管理員
    </label>

  </section>


  <!-- ===================================================== -->
  <!-- 功能列 -->
  <!-- ===================================================== -->

  <section class="toolbar-action">

    <div class="toolbar-left">

      <button
        class="btn-primary"
        onclick="openCreateUserModal()">
        ＋ 新增使用者
      </button>

    </div>

    <div class="toolbar-right">

      <button class="btn-outline">
        📥 匯入
      </button>

      <button class="btn-outline">
        📤 匯出
      </button>

      <button class="btn-outline">
        🔑 批次重設密碼
      </button>

    </div>

  </section>


  <!-- ===================================================== -->
  <!-- 使用者清單 -->
  <!-- ===================================================== -->

  <section class="table-panel">

    <div class="table-header">

      <div class="table-title">
        👥 使用者清單
      </div>

      <div
        class="table-count"
        id="tableCount">
        共 74 筆
      </div>

    </div>

    <div class="table-wrapper">

      <table class="user-table">

        <thead>

          <tr>

            <th>背號</th>

            <th>姓名</th>

            <th>身份</th>

            <th>證照</th>

            <th>年度出勤</th>

            <th>聯絡資訊</th>

            <th>狀態</th>

            <th>操作</th>

          </tr>

        </thead>

        <tbody id="userTableBody">

          <!-- renderUserTable() -->

          <tr>

            <td>#35</td>

            <td>

              <div class="tb-name">
                王韶文
              </div>

              <div class="tb-account">
                baseballamis
              </div>

            </td>

            <td>

              <div class="table-badges">

                <span class="role-badge role-judge">
                  裁判
                </span>

                <span class="role-badge role-record">
                  紀錄
                </span>

              </div>

            </td>

            <td>

              <div>
                🏅 B級
              </div>

              <div>
                📝 C級
              </div>

            </td>

            <td>

              <div class="attendance-cell">

                <div class="attendance-count">
                  32 場
                </div>

                <div class="attendance-rate">
                  完成率 98%
                </div>

              </div>

            </td>

            <td>

              <div>
                📧 aaa@gmail.com
              </div>

              <div>
                📱 0912345678
              </div>

            </td>

            <td>

              <span class="status-badge status-active">
                啟用
              </span>

            </td>

            <td class="action-col">

              <button
                class="action-btn stat"
                title="個人統計">
                📊
              </button>

              <button
                class="action-btn edit"
                title="編輯資料">
                ✏️
              </button>

              <button
                class="action-btn password"
                title="重設密碼">
                🔑
              </button>

              <button
                class="action-btn delete"
                title="刪除使用者">
                🗑
              </button>

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </section>

</div>

</body>
