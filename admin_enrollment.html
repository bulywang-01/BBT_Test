<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學員報名與審核管理</title>
  <link rel="stylesheet" href="css/signup_dashboard.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body data-page-title="報名審核管理" class="page-admin">

  <script src="js/auth.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>

  <div id="header-container"></div>

  <script>
    function loadHeader() {
      fetch('header.html')
        .then(res => res.text())
        .then(html => {
          document.getElementById('header-container').innerHTML = html;
          const session = (typeof getSession === 'function') ? getSession() : null;
          document.body.classList.remove('role-admin', 'role-judge', 'role-record');
          if (session && session.role) {
            const roles = session.role.split(',').map(r => r.trim());
            if (roles.includes('admin')) document.body.classList.add('role-admin');
          }
        })
        .catch(err => console.error('Header 載入失敗', err));
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadHeader();
      loadEnrollments();
    });
  </script>

  <div class="main max-w-7xl mx-auto p-6">
    <div class="mb-6 flex justify-between items-center">
      <div>
        <h2 class="text-2xl font-black text-slate-900">📋 學員報名與審核管理</h2>
        <p class="text-sm text-slate-500">在此檢視所有學員的報名狀態、繳費狀況，並可直接更新審核與出席成績。</p>
      </div>
      <button onclick="loadEnrollments()" class="bg-slate-900 hover:bg-slate-800 text-white font-bold px-4 py-2 rounded-xl text-sm transition">
        重新整理
      </button>
    </div>

    <!-- 報名清單表格 -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase">
            <th class="p-4">報名序號</th>
            <th class="p-4">學員姓名</th>
            <th class="p-4">課程名稱</th>
            <th class="p-4">報名時間</th>
            <th class="p-4">報名狀態</th>
            <th class="p-4">繳費狀態</th>
            <th class="p-4">出席狀態</th>
            <th class="p-4">成績</th>
            <th class="p-4 text-center">操作</th>
          </tr>
        </thead>
        <tbody id="enrollment-table-body" class="divide-y divide-slate-100 text-sm">
          <tr><td colspan="9" class="text-center py-8 text-slate-400">載入報名資料中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let allEnrollments = [];

    function loadEnrollments() {
      const baseUrl = typeof API_BASE !== 'undefined' ? API_BASE : (typeof API_URL !== 'undefined' ? API_URL : '');
      const callbackName = 'jsonp_enrollments_' + Math.round(100000 * Math.random());

      window[callbackName] = function(res) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);

        if (res && res.result === 'ok') {
          allEnrollments = res.data || [];
          renderTable(allEnrollments);
        } else {
          document.getElementById('enrollment-table-body').innerHTML = `<tr><td colspan="9" class="text-center py-8 text-rose-500">載入失敗：${res ? res.message : '未知錯誤'}</td></tr>`;
        }
      };

      const script = document.createElement('script');
      script.src = `${baseUrl}?action=getAllEnrollments&callback=${callbackName}`;
      script.onerror = function() {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        alert('網路連線異常');
      };
      document.body.appendChild(script);
    }

    function renderTable(list) {
      const tbody = document.getElementById('enrollment-table-body');
      if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center py-8 text-slate-400">目前尚無任何學員報名記錄</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(item => `
        <tr class="hover:bg-slate-50/50 transition">
          <td class="p-4 font-mono text-xs text-slate-500">${item.log_id}</td>
          <td class="p-4 font-bold text-slate-900">${item.name || 'ID: ' + item.user_id}</td>
          <td class="p-4 font-medium text-slate-800">${item.course_name}</td>
          <td class="p-4 text-xs text-slate-500">${item.created_at}</td>
          
          <!-- 報名狀態 -->
          <td class="p-4">
            <select id="status_${item.log_id}" class="border rounded-lg px-2 py-1 text-xs font-bold ${item.status === 'waitlist' ? 'bg-amber-50 text-amber-700 border-amber-200' : 'bg-blue-50 text-blue-700 border-blue-200'}">
              <option value="applied" ${item.status === 'applied' ? 'selected' : ''}>已申請(正取)</option>
              <option value="confirmed" ${item.status === 'confirmed' ? 'selected' : ''}>已錄取</option>
              <option value="waitlist" ${item.status === 'waitlist' ? 'selected' : ''}>候補中</option>
              <option value="cancelled" ${item.status === 'cancelled' ? 'selected' : ''}>已取消</option>
            </select>
          </td>

          <!-- 繳費狀態 -->
          <td class="p-4">
            <select id="payment_${item.log_id}" class="border rounded-lg px-2 py-1 text-xs font-semibold ${item.payment_status === 'paid' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-slate-50 text-slate-600 border-slate-200'}">
              <option value="unpaid" ${item.payment_status === 'unpaid' ? 'selected' : ''}>未繳費</option>
              <option value="paid" ${item.payment_status === 'paid' ? 'selected' : ''}>已繳費</option>
            </select>
          </td>

          <!-- 出席狀態 -->
          <td class="p-4">
            <select id="attendance_${item.log_id}" class="border rounded-lg px-2 py-1 text-xs">
              <option value="pending" ${item.attendance_status === 'pending' ? 'selected' : ''}>待上課</option>
              <option value="attended" ${item.attendance_status === 'attended' ? 'selected' : ''}>已出席</option>
              <option value="absent" ${item.attendance_status === 'absent' ? 'selected' : ''}>缺席</option>
              <option value="completed" ${item.attendance_status === 'completed' ? 'selected' : ''}>已結訓</option>
            </select>
          </td>

          <!-- 成績 -->
          <td class="p-4">
            <input type="number" id="score_${item.log_id}" value="${item.score !== '' ? item.score : ''}" placeholder="分數" class="w-16 border rounded-lg px-2 py-1 text-xs text-center">
          </td>

          <!-- 操作按鈕 -->
          <td class="p-4 text-center">
            <button onclick="updateStatus('${item.log_id}')" class="bg-slate-900 hover:bg-slate-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-sm">
              儲存
            </button>
          </td>
        </tr>
      `).join('');
    }

    function updateStatus(logId) {
      const baseUrl = typeof API_BASE !== 'undefined' ? API_BASE : (typeof API_URL !== 'undefined' ? API_URL : '');
      const status = document.getElementById(`status_${logId}`).value;
      const payment_status = document.getElementById(`payment_${logId}`).value;
      const attendance_status = document.getElementById(`attendance_${logId}`).value;
      const score = document.getElementById(`score_${logId}`).value;

      const callbackName = 'jsonp_update_' + Math.round(100000 * Math.random());
      window[callbackName] = function(res) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);

        if (res && res.result === 'ok') {
          alert('✅ 更新成功！');
          loadEnrollments();
        } else {
          alert('❌ 更新失敗：' + (res ? res.message : '未知錯誤'));
        }
      };

      const script = document.createElement('script');
      script.src = `${baseUrl}?action=updateTrainingStatus&log_id=${logId}&status=${status}&payment_status=${payment_status}&attendance_status=${attendance_status}&score=${score}&callback=${callbackName}`;
      script.onerror = function() {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        alert('網路連線異常');
      };
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
