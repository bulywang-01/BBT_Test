<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>賽事管理中心</title>

<link rel="stylesheet" href="common.css">

<style>

/* =================================
   Base
================================= */

body{
  margin:0;
  background:#f1f5f9;
  font-family:
    "Noto Sans TC",
    sans-serif;
}

.page{
  max-width:1600px;
  margin:auto;
  padding:20px;
}

/* =================================
   Header
================================= */

.page-header{
  margin-bottom:20px;
}

.page-title{
  font-size:32px;
  font-weight:900;
  color:#0f172a;
}

.page-desc{
  margin-top:4px;
  color:#64748b;
  font-size:14px;
}

/* =================================
   KPI
================================= */

.kpi-grid{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);

  gap:16px;
  margin-bottom:20px;
}

.kpi-card{
  background:#fff;
  border-radius:16px;
  padding:18px;

  box-shadow:
    0 1px 6px
    rgba(0,0,0,.08);
}

.kpi-label{
  color:#64748b;
  font-size:13px;
}

.kpi-value{
  margin-top:8px;
  font-size:34px;
  font-weight:900;
}

.blue{
  color:#2563eb;
}

.green{
  color:#16a34a;
}

.orange{
  color:#ea580c;
}

.purple{
  color:#7c3aed;
}

/* =================================
   Toolbar
================================= */

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;

  background:white;
  border-radius:16px;

  padding:16px;
  margin-bottom:20px;
}

.filter-buttons{
  display:flex;
  gap:8px;
}

.filter-buttons button{

  border:none;
  border-radius:10px;

  padding:8px 14px;

  cursor:pointer;

  background:#e2e8f0;
}

.filter-buttons button.active{
  background:#2563eb;
  color:white;
}

.search-box{

  width:280px;

  border:1px solid #cbd5e1;

  border-radius:10px;

  padding:8px 12px;
}

/* =================================
   Create Area
================================= */

.card{

  background:white;

  border-radius:16px;

  padding:20px;

  margin-bottom:24px;

  box-shadow:
    0 1px 6px
    rgba(0,0,0,.08);
}

.card-title{
  font-weight:800;
  font-size:18px;

  margin-bottom:14px;
}

.create-form{

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:10px;
}

.create-form input,
.create-form select{

  height:40px;

  border:1px solid #cbd5e1;

  border-radius:10px;

  padding:0 10px;
}

.primary-btn{

  margin-top:14px;

  background:#2563eb;
  color:white;

  border:none;

  border-radius:10px;

  padding:10px 18px;

  cursor:pointer;
}

/* =================================
   Tournament
================================= */

.tournament-section{
  margin-bottom:24px;
}

.tournament-header{

  background:#0f172a;
  color:white;

  padding:12px 16px;

  border-radius:12px;

  font-size:18px;
  font-weight:800;
}

.game-list{
  margin-top:12px;

  display:grid;
  gap:10px;
}

.game-card{

  background:white;

  border-radius:14px;

  padding:16px;

  border:1px solid #e2e8f0;

  box-shadow:
    0 1px 3px
    rgba(0,0,0,.04);
}

.game-top{

  display:flex;
  justify-content:space-between;

  margin-bottom:10px;
}

.game-code{

  font-size:18px;
  font-weight:900;

  color:#2563eb;
}

.status{

  padding:4px 10px;

  border-radius:999px;

  font-size:12px;
  font-weight:700;
}

.status-normal{
  background:#dcfce7;
  color:#166534;
}

.status-hold{
  background:#fef9c3;
  color:#854d0e;
}

.status-cancel{
  background:#e5e7eb;
  color:#374151;
}

.game-info{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:10px;

  margin-bottom:10px;

  font-size:13px;
}

.game-match{

  font-size:16px;

  font-weight:800;

  margin-bottom:8px;
}

.game-meta{

  color:#64748b;
  font-size:13px;
}

.action-bar{

  margin-top:12px;

  display:flex;
  gap:8px;
}

.btn{

  border:none;
  border-radius:10px;

  padding:8px 12px;

  cursor:pointer;
}

.btn-edit{
  background:#f59e0b;
  color:white;
}

.btn-judge{
  background:#2563eb;
  color:white;
}

.btn-record{
  background:#10b981;
  color:white;
}

.btn-delete{
  background:#ef4444;
  color:white;
}

/* =================================
   Mobile
================================= */

@media(max-width:768px){

  .kpi-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .toolbar{
    flex-direction:column;
    align-items:stretch;
  }

  .search-box{
    width:100%;
  }

  .create-form{
    grid-template-columns:1fr;
  }

  .game-info{
    grid-template-columns:1fr 1fr;
  }

  .action-bar{
    flex-wrap:wrap;
  }

}
</style>
</head>

<body>

<div id="header-container"></div>

<div class="page">

  <div class="page-header">

    <div class="page-title">
      🎯 賽事管理中心
    </div>

    <div class="page-desc">
      建立、維護、派遣與追蹤賽事
    </div>

  </div>

  <!-- KPI -->

  <div class="kpi-grid">

    <div class="kpi-card">
      <div class="kpi-label">總賽事</div>
      <div id="kpiTotal" class="kpi-value blue">
        148
      </div>
    </div>

    <div class="kpi-card">
      <div class="kpi-label">本週賽事</div>
      <div id="kpiWeek" class="kpi-value green">
        9
      </div>
    </div>

    <div class="kpi-card">
      <div class="kpi-label">未完賽</div>
      <div id="kpiPending" class="kpi-value orange">
        38
      </div>
    </div>

    <div class="kpi-card">
      <div class="kpi-label">已完賽</div>
      <div id="kpiFinish" class="kpi-value purple">
        110
      </div>
    </div>

  </div>

  <!-- Filter -->

  <div class="toolbar">

    <div class="filter-buttons">

      <button class="active">全部</button>
      <button>本週</button>
      <button>本月</button>
      <button>缺額</button>

    </div>

    <input
      class="search-box"
      placeholder="搜尋場次、球隊、場地">

  </div>

  <!-- Create -->

  <div class="card">

    <div class="card-title">
      ➕ 快速新增賽事
    </div>

    <div class="create-form">

      <input placeholder="場次">
      <input type="date">
      <input type="time">

      <input placeholder="賽事名稱">
      <input placeholder="組別">

      <input placeholder="場地">

      <input placeholder="客隊">
      <input placeholder="主隊">

      <input placeholder="裁判數">

      <select>
        <option>正常</option>
        <option>暫存</option>
      </select>

    </div>

    <button class="primary-btn">
      ✅ 建立賽事
    </button>

  </div>

  <!-- Tournament -->

  <div class="tournament-section">

    <div class="tournament-header">
      📁 2026-BBT聯盟
    </div>

    <div class="game-list">

      <div class="game-card">

        <div class="game-top">

          <div class="game-code">
            A044
          </div>

          <div class="status status-normal">
            正常
          </div>

        </div>

        <div class="game-info">

          <div>📅 2026-11-01</div>
          <div>🕒 10:15</div>
          <div>📍 土城綜合</div>
          <div>⚖️ 2席</div>

        </div>

        <div class="game-meta">
          大聯盟組
        </div>

        <div class="game-match">
          胖虎軍團 VS 賽亞人
        </div>

        <div class="action-bar">

          <button class="btn btn-edit">
            ✏️ 修改
          </button>

          <button class="btn btn-judge">
            ⚖️ 裁判
          </button>

          <button class="btn btn-record">
            📝 紀錄
          </button>

          <button class="btn btn-delete">
            🗑 刪除
          </button>

        </div>

      </div>

    </div>

  </div>

</div>

</body>
</html>
