<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBT 聯盟線上課程報名</title>

  <link rel="stylesheet" href="css/signup_dashboard.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body data-page-title="線上課程報名" class="page-course">

  <script src="js/auth.js"></script>
  <script src="js/config.js"></script>
  <script src="js/header.js"></script>
  <script src="js/core.js"></script>

  <div id="header-container"></div>

  <script>
    function loadHeader() {
      fetch('header.html')
        .then(res => res.text())
        .then(html => {
          document.getElementById('header-container').innerHTML = html;
          const session = (typeof getSession === 'function') ? getSession() : null;
          document.body.classList.remove('role-admin', 'role-judge', 'role-record');

          if (session && session.role) {
            const roles = session.role.split(',').map(r => r.trim());
            if (roles.includes('admin')) document.body.classList.add('role-admin');
            if (roles.includes('judge') || roles.includes('chief_judge')) document.body.classList.add('role-judge');
            if (roles.includes('record') || roles.includes('record_chief')) document.body.classList.add('role-record');
          }
        })
        .catch(err => console.error('Header 載入失敗', err));
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadHeader();
      loadDataAndCourses();
    });
  </script>

  <div class="main max-w-7xl mx-auto p-6">
    <div class="mb-6 flex justify-between items-center">
      <div>
        <h2 class="text-2xl font-black text-slate-900">近期開課列表</h2>
        <p class="text-sm text-slate-600">請選擇您想報名的課程，額滿將自動轉為候補名單。</p>
      </div>
      <a href="my_courses.html" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-sm transition shadow-sm">
        我的課程 / 報名紀錄
      </a>
    </div>

    <div id="content" class="space-y-6">
      <div class="text-center py-10 text-slate-500 font-semibold text-base">載入課程中...</div>
    </div>
  </div>

  <!-- 報名確認 Modal -->
  <div id="signup-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
      <h3 id="modal-course-title" class="text-xl font-bold text-slate-900">確認報名</h3>
      <p id="modal-course-info" class="text-base text-slate-700 leading-relaxed"></p>
      <div class="flex justify-end gap-3 pt-2">
        <button onclick="closeSignupModal()" id="modal-cancel-btn" class="px-5 py-2.5 rounded-xl border text-slate-700 hover:bg-slate-50 font-bold text-sm">取消</button>
        <button id="confirm-signup-btn" onclick="submitSignup()" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm">確認送出報名</button>
      </div>
    </div>
  </div>

  <script>
    let allCourses = [];
    let myEnrollments = [];
    let selectedCourseId = null;

    function formatDateOnly(isoString) {
      if (!isoString) return '';
      const d = new Date(isoString);
      if (isNaN(d)) return isoString;
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function getCourseDateDisplay(c) {
      const start = formatDateOnly(c.date || c.start_date);
      const end = formatDateOnly(c.end_date);
      if (start && end && start !== end) {
        return `${start} ～ ${end}`;
      }
      return start || '未定日期';
    }

    function loadDataAndCourses() {
      const session = JSON.parse(localStorage.getItem('session_user') || '{}');
      const baseUrl = typeof API_BASE !== 'undefined' ? API_BASE : (typeof API_URL !== 'undefined' ? API_URL : '');
      
      const cbCourses = 'jsonp_courses_' + Math.round(100000 * Math.random());
      window[cbCourses] = function(res) {
        delete window[cbCourses];
        if (s1.parentNode) s1.parentNode.removeChild(s1);
        if (res && res.result === 'ok') {
          allCourses = res.data || [];
          if (session.user_id) {
            loadMyEnrollmentsAndRender(session.user_id, baseUrl);
          } else {
            renderCourses(allCourses, []);
          }
        } else {
          document.getElementById('content').innerHTML = `<div class="bg-rose-50 text-rose-700 p-4 rounded-xl font-bold">載入課程失敗：${res ? res.message : '未知錯誤'}</div>`;
        }
      };

      const s1 = document.createElement('script');
      s1.src = `${baseUrl}?action=getCourses&callback=${cbCourses}`;
      document.body.appendChild(s1);
    }

    function loadMyEnrollmentsAndRender(userId, baseUrl) {
      const cbLog = 'jsonp_mylog_' + Math.round(100000 * Math.random());
      window[cbLog] = function(res) {
        delete window[cbLog];
        if (s2.parentNode) s2.parentNode.removeChild(s2);
        if (res && res.result === 'ok') {
          myEnrollments = (res.data || []).filter(item => String(item.user_id) === String(userId) && item.status !== 'cancelled');
        }
        renderCourses(allCourses, myEnrollments);
      };

      const s2 = document.createElement('script');
      s2.src = `${baseUrl}?action=getTrainingLog&user_id=${userId}&callback=${cbLog}`;
      document.body.appendChild(s2);
    }

    function renderCourses(courses, enrollments) {
      const root = document.getElementById('content');
      if (!courses.length) {
        root.innerHTML = `<div class="bg-white rounded-2xl p-10 text-center border border-slate-200 text-slate-500 font-bold">目前無開放報名的課程</div>`;
        return;
      }

      const enrolledMap = {};
      enrollments.forEach(en => {
        enrolledMap[String(en.course_id)] = {
          status: en.status,
          payment_status: en.payment_status
        };
      });

      const dateMap = {};
      courses.forEach(c => {
        const dateDisplay = getCourseDateDisplay(c);
        if (!dateMap[dateDisplay]) dateMap[dateDisplay] = [];
        dateMap[dateDisplay].push(c);
      });

      root.innerHTML = '';

      Object.keys(dateMap).sort().forEach(dateGroup => {
        const dayCourses = dateMap[dateGroup];

        root.innerHTML += `
          <div class="space-y-4">
            <div class="flex items-center gap-2 border-b-2 border-slate-300 pb-2">
              <span class="text-lg font-black text-slate-900">📅 ${dateGroup}</span>
              <span class="text-sm font-semibold text-slate-500">（共 ${dayCourses.length} 門課程）</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              ${dayCourses.map(c => {
                const cId = String(c.course_id);
                const enrollmentInfo = enrolledMap[cId];
                const isEnrolled = !!enrollmentInfo;
                const isFull = (c.current_enrollment || 0) >= (c.capacity || 30);
                const dateDisplay = getCourseDateDisplay(c);
                const courseTime = c.time || c.course_time || '依課程公告為準';

                let btnText = '立即報名';
                let btnClass = 'bg-slate-900 hover:bg-slate-800';
                if (isEnrolled) {
                  btnText = enrollmentInfo.status === 'waitlist' ? '已在候補名單中' : '已報名（正取/錄取）';
                  btnClass = 'bg-emerald-600 cursor-not-allowed opacity-90';
                } else if (isFull) {
                  btnText = '額滿（點擊報名將加入候補）';
                  btnClass = 'bg-amber-600 hover:bg-amber-700';
                }

                let statusBadge = '';
                if (isEnrolled) {
                  const stText = enrollmentInfo.status === 'waitlist' ? '候補中' : (enrollmentInfo.status === 'confirmed' ? '已錄取' : '已申請(正取)');
                  const stClass = enrollmentInfo.status === 'waitlist' ? 'bg-amber-50 text-amber-800 border-amber-300' : 'bg-emerald-50 text-emerald-800 border-emerald-300';
                  const payText = enrollmentInfo.payment_status === 'paid' ? '已繳費' : '未繳費';
                  const payClass = enrollmentInfo.payment_status === 'paid' ? 'text-emerald-700 font-black' : 'text-rose-700 font-black';

                  statusBadge = `
                    <div class="bg-slate-100 p-3.5 rounded-xl flex items-center justify-between text-sm font-bold border border-slate-300 shadow-sm">
                      <div class="flex items-center gap-3">
                        <span class="px-2.5 py-1 rounded-lg border ${stClass}">${stText}</span>
                        <span class="text-slate-700">繳費狀況：<span class="${payClass}">${payText}</span></span>
                      </div>
                      <a href="my_courses.html" class="text-blue-700 hover:underline font-extrabold">查看紀錄 &rarr;</a>
                    </div>
                  `;
                }

                return `
                  <div class="bg-white rounded-2xl shadow-md border border-slate-300 p-6 flex flex-col justify-between space-y-5">
                    <div class="space-y-4">
                      <div class="flex justify-between items-start">
                        <div class="flex flex-wrap gap-2">
                          <span class="px-3 py-1 text-xs font-black rounded-lg bg-blue-100 text-blue-800 border border-blue-200">${c.course_type || '課程'}</span>
                          ${c.certificate_type ? `<span class="px-3 py-1 text-xs font-black rounded-lg bg-purple-100 text-purple-800 border border-purple-200">證照：${c.certificate_type} ${c.certificate_level || ''}</span>` : ''}
                        </div>
                        <span class="text-sm font-bold text-slate-500">培訓時數：${c.training_hours || 0}hr</span>
                      </div>

                      <div>
                        <h3 class="text-2xl font-black text-slate-900 leading-snug">${c.course_name}</h3>
                        <p class="text-sm font-bold text-slate-600 mt-1">👨‍🏫 講師：${c.instructor || '未指定'}</p>
                      </div>

                      ${statusBadge}

                      <!-- 核心資訊摘要 (字體全面放大加粗) -->
                      <div class="bg-slate-50 p-4 rounded-xl space-y-2 text-base text-slate-800 border border-slate-200">
                        <div>📅 <span class="font-bold text-slate-600">日期：</span><span class="font-black text-slate-900">${dateDisplay}</span></div>
                        <div>⏰ <span class="font-bold text-slate-600">時間：</span><span class="font-black text-slate-900">${courseTime}</span></div>
                        <div>📍 <span class="font-bold text-slate-600">地點：</span><span class="font-black text-slate-900">${c.location || '實體/線上'}</span></div>
                        <div>💰 <span class="font-bold text-slate-600">費用：</span><span class="font-black text-slate-900">${c.fee == 0 ? '免費' : 'NT$ ' + c.fee}</span></div>
                        <div>👥 <span class="font-bold text-slate-600">名額：</span><span class="font-black text-slate-900">已報名 ${c.current_enrollment || 0} / 正取 ${c.capacity || 30} (候補上限 ${c.waitlist_capacity || 10})</span></div>
                      </div>

                      <!-- 展開/收合詳細資訊區塊 (字體放大) -->
                      <details class="group border border-slate-300 rounded-xl overflow-hidden bg-slate-50/70 shadow-sm">
                        <summary class="px-4 py-3 text-sm font-black text-slate-800 cursor-pointer select-none flex justify-between items-center hover:bg-slate-100 transition">
                          <span>🔍 檢視完整課程與報名規定細節</span>
                          <span class="group-open:rotate-180 transition transform text-slate-500 font-bold">▼</span>
                        </summary>
                        <div class="p-4 space-y-2.5 text-sm font-bold text-slate-700 border-t border-slate-300 bg-white leading-relaxed">
                          <div>📝 <b>報名資格：</b>${c.signup_type === 'member_only' ? '限本聯盟會員' : (c.signup_type === 'licensed_only' ? '限具備特定證照者' : '公開報名')}</div>
                          <div>⏳ <b>報名期限：</b>${c.signup_start ? formatDateOnly(c.signup_start) : '即日起'} ～ ${c.signup_end ? formatDateOnly(c.signup_end) : '額滿為止'}</div>
                          <div>📜 <b>結訓證照時數：</b>${c.certificate_hours || 0} (${c.certificate_action === 'upgrade_role' ? '結訓自動升級權限' : '發放證書'})</div>
                          <div>🚫 <b>取消政策：</b>${c.allow_cancel === 'Y' ? '允許學員自行取消' : '不允許線上取消'}</div>
                          ${c.location_url ? `<div>🔗 <b>線上會議網址：</b><a href="${c.location_url}" target="_blank" class="text-blue-700 underline font-black">點擊前往視訊教室</a></div>` : ''}
                          ${c.remark ? `<div class="pt-1 text-slate-600">💬 <b>備註說明：</b>${c.remark}</div>` : ''}
                        </div>
                      </details>
                    </div>

                    <button onclick="${isEnrolled ? '' : `openSignupModal('${c.course_id}', '${c.course_name}', '${dateDisplay}')`}" 
                      id="btn_${c.course_id}"
                      class="w-full ${btnClass} text-white font-black py-3 rounded-xl text-base transition shadow-md"
                      ${isEnrolled ? 'disabled' : ''}>
                      ${btnText}
                    </button>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });
    }

    function openSignupModal(courseId, courseName, courseDate) {
      selectedCourseId = courseId;
      document.getElementById('modal-course-title').textContent = `確認報名：${courseName}`;
      document.getElementById('modal-course-info').textContent = `上課日期：${courseDate}。\n送出後將由系統進行資格審核與名額分配（若正取額滿將自動轉為候補）。`;
      document.getElementById('signup-modal').classList.remove('hidden');
    }

    function closeSignupModal() {
      selectedCourseId = null;
      document.getElementById('signup-modal').classList.add('hidden');
    }

    function submitSignup() {
      const session = JSON.parse(localStorage.getItem('session_user') || '{}');
      if (!session.user_id) {
        alert('請先登入系統');
        location.href = 'login.html';
        return;
      }

      const confirmBtn = document.getElementById('confirm-signup-btn');
      const cancelBtn = document.getElementById('modal-cancel-btn');
      confirmBtn.disabled = true;
      cancelBtn.disabled = true;
      confirmBtn.textContent = '⏳ 系統處理中，請稍候...';

      const baseUrl = typeof API_BASE !== 'undefined' ? API_BASE : (typeof API_URL !== 'undefined' ? API_URL : '');
      const callbackName = 'jsonp_signup_' + Math.round(100000 * Math.random());
      
      window[callbackName] = function(res) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);

        confirmBtn.disabled = false;
        cancelBtn.disabled = false;
        confirmBtn.textContent = '確認送出報名';

        if (res && (res.result === 'ok' || res.result === 'waitlist')) {
          alert(res.message || '報名成功！');
          closeSignupModal();
          loadDataAndCourses();
        } else {
          alert('報名失敗：' + (res ? res.message : '未知錯誤'));
        }
      };

      const script = document.createElement('script');
      script.src = `${baseUrl}?action=enrollCourse&user_id=${session.user_id}&course_id=${selectedCourseId}&callback=${callbackName}`;
      script.onerror = function() {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        confirmBtn.disabled = false;
        cancelBtn.disabled = false;
        confirmBtn.textContent = '確認送出報名';
        alert('網路連線異常，請稍後再試');
      };
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
