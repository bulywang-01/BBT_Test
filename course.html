<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBT 聯盟線上課程報名</title>

  <link rel="stylesheet" href="css/signup_dashboard.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body data-page-title="線上課程報名" class="page-course">

  <script src="js/auth.js"></script>
  <script src="js/config.js"></script>
  <script src="js/header.js"></script>
  <script src="js/core.js"></script>

  <div id="header-container"></div>

  <script>
    function loadHeader() {
      fetch('header.html')
        .then(res => res.text())
        .then(html => {
          document.getElementById('header-container').innerHTML = html;
          const session = (typeof getSession === 'function') ? getSession() : null;
          document.body.classList.remove('role-admin', 'role-judge', 'role-record');

          if (session && session.role) {
            const roles = session.role.split(',').map(r => r.trim());
            if (roles.includes('admin')) document.body.classList.add('role-admin');
            if (roles.includes('judge') || roles.includes('chief_judge')) document.body.classList.add('role-judge');
            if (roles.includes('record') || roles.includes('record_chief')) document.body.classList.add('role-record');
          }
        })
        .catch(err => console.error('Header 載入失敗', err));
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadHeader();
      loadDataAndCourses();
    });
  </script>

  <div class="main max-w-7xl mx-auto p-6">
    <div class="mb-6 flex justify-between items-center">
      <div>
        <h2 class="text-2xl font-black text-slate-900">近期開課列表</h2>
        <p class="text-sm text-slate-500">請選擇您想報名的課程，額滿將自動轉為候補名單。</p>
      </div>
      <a href="my_courses.html" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm transition shadow-sm">
        我的課程 / 報名紀錄
      </a>
    </div>

    <div id="content" class="space-y-6">
      <div class="text-center py-10 text-slate-400">載入課程中...</div>
    </div>
  </div>

  <!-- 報名確認 Modal -->
  <div id="signup-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4">
      <h3 id="modal-course-title" class="text-lg font-bold text-slate-900">確認報名</h3>
      <p id="modal-course-info" class="text-sm text-slate-600"></p>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeSignupModal()" id="modal-cancel-btn" class="px-4 py-2 rounded-xl border text-slate-600 hover:bg-slate-50 font-semibold text-sm">取消</button>
        <button id="confirm-signup-btn" onclick="submitSignup()" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm">確認送出報名</button>
      </div>
    </div>
  </div>

  <script>
    let allCourses = [];
    let myEnrollments = [];
    let selectedCourseId = null;

    function formatDateOnly(isoString) {
      if (!isoString) return '未定';
      const d = new Date(isoString);
      if (isNaN(d)) return isoString;
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    // 同時載入課程清單與目前登入者的報名紀錄
    function loadDataAndCourses() {
      const session = JSON.parse(localStorage.getItem('session_user') || '{}');
      const baseUrl = typeof API_BASE !== 'undefined' ? API_BASE : (typeof API_URL !== 'undefined' ? API_URL : '');
      
      // 1. 取得課程
      const cbCourses = 'jsonp_courses_' + Math.round(100000 * Math.random());
      window[cbCourses] = function(res) {
        delete window[cbCourses];
        if (s1.parentNode) s1.parentNode.removeChild(s1);
        if (res && res.result === 'ok') {
          allCourses = res.data || [];
          if (session.user_id) {
            loadMyEnrollmentsAndRender(session.user_id, baseUrl);
          } else {
            renderCourses(allCourses, []);
          }
        } else {
          document.getElementById('content').innerHTML = `<div class="row-warning">載入課程失敗：${res ? res.message : '未知錯誤'}</div>`;
        }
      };

      const s1 = document.createElement('script');
      s1.src = `${baseUrl}?action=getCourses&callback=${cbCourses}`;
      document.body.appendChild(s1);
    }

    function loadMyEnrollmentsAndRender(userId, baseUrl) {
      const cbLog = 'jsonp_mylog_' + Math.round(100000 * Math.random());
      window[cbLog] = function(res) {
        delete window[cbLog];
        if (s2.parentNode) s2.parentNode.removeChild(s2);
        if (res && res.result === 'ok') {
          myEnrollments = (res.data || []).filter(item => String(item.user_id) === String(userId) && item.status !== 'cancelled');
        }
        renderCourses(allCourses, myEnrollments);
      };

      const s2 = document.createElement('script');
      s2.src = `${baseUrl}?action=getTrainingLog&user_id=${userId}&callback=${cbLog}`;
      document.body.appendChild(s2);
    }

    function renderCourses(courses, enrollments) {
      const root = document.getElementById('content');
      if (!courses.length) {
        root.innerHTML = `<div class="bg-white rounded-2xl p-10 text-center border border-slate-200 text-slate-400">目前無開放報名的課程</div>`;
        return;
      }

      // 建立已報名課程對照表 { courseId: status }
      const enrolledMap = {};
      enrollments.forEach(en => {
        enrolledMap[String(en.course_id)] = en.status; // applied, confirmed, waitlist
      });

      const dateMap = {};
      courses.forEach(c => {
        const d = formatDateOnly(c.date) || '未定日期';
        if (!dateMap[d]) dateMap[d] = [];
        dateMap[d].push(c);
      });

      root.innerHTML = '';

      Object.keys(dateMap).sort().forEach(date => {
        const dayCourses = dateMap[date];

        root.innerHTML += `
          <div class="space-y-3">
            <div class="flex items-center gap-2 border-b border-slate-200 pb-2">
              <span class="text-base font-black text-slate-900">📅 ${date}</span>
              <span class="text-xs text-slate-400">（共 ${dayCourses.length} 門課程）</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${dayCourses.map(c => {
                const cId = String(c.course_id);
                const userStatus = enrolledMap[cId];
                const isEnrolled = !!userStatus;
                const isFull = (c.current_enrollment || 0) >= (c.capacity || 30);

                // 按鈕文字與狀態
                let btnText = '立即報名';
                let btnClass = 'bg-slate-900 hover:bg-slate-800';
                if (isEnrolled) {
                  btnText = userStatus === 'waitlist' ? '已在候補名單中' : '已報名（正取/錄取）';
                  btnClass = 'bg-emerald-600 cursor-not-allowed opacity-90';
                } else if (isFull) {
                  btnText = '額滿（點擊報名將加入候補）';
                  btnClass = 'bg-amber-600 hover:bg-amber-700';
                }

                return `
                  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between space-y-4">
                    <div class="space-y-3">
                      <!-- 頂部標籤與時數 -->
                      <div class="flex justify-between items-start">
                        <div class="flex flex-wrap gap-1.5">
                          <span class="px-2.5 py-0.5 text-xs font-bold rounded-md bg-blue-50 text-blue-700 border border-blue-100">${c.course_type || '課程'}</span>
                          ${c.certificate_type ? `<span class="px-2.5 py-0.5 text-xs font-bold rounded-md bg-purple-50 text-purple-700 border border-purple-100">證照：${c.certificate_type} ${c.certificate_level || ''}</span>` : ''}
                        </div>
                        <span class="text-xs font-semibold text-slate-400">培訓時數：${c.training_hours || 0}hr</span>
                      </div>

                      <h3 class="text-xl font-bold text-slate-900">${c.course_name}</h3>
                      <p class="text-xs text-slate-500">👨‍🏫 講師：${c.instructor || '未指定'}</p>

                      <!-- 核心資訊摘要 -->
                      <div class="bg-slate-50 p-3.5 rounded-xl space-y-1.5 text-sm text-slate-600">
                        <div>📍 地點：<span class="font-medium text-slate-800">${c.location || '實體/線上'}</span></div>
                        <div>💰 費用：<span class="font-medium text-slate-800">${c.fee == 0 ? '免費' : 'NT$ ' + c.fee}</span></div>
                        <div>👥 名額：<span class="font-medium text-slate-800">已報名 ${c.current_enrollment || 0} / 正取 ${c.capacity || 30} (候補上限 ${c.waitlist_capacity || 10})</span></div>
                      </div>

                      <!-- 展開/收合詳細資訊區塊 -->
                      <details class="group border border-slate-200 rounded-xl overflow-hidden bg-slate-50/50">
                        <summary class="px-4 py-2.5 text-xs font-bold text-slate-700 cursor-pointer select-none flex justify-between items-center hover:bg-slate-100 transition">
                          <span>🔍 檢視完整課程與報名規定細節</span>
                          <span class="group-open:rotate-180 transition transform text-slate-400">▼</span>
                        </summary>
                        <div class="p-4 space-y-2 text-xs text-slate-600 border-t border-slate-200 bg-white">
                          <div>📝 <b>報名資格：</b>${c.signup_type === 'member_only' ? '限本聯盟會員' : (c.signup_type === 'licensed_only' ? '限具備特定證照者' : '公開報名')}</div>
                          <div>⏳ <b>報名期限：</b>${c.signup_start ? formatDateOnly(c.signup_start) : '即日起'} ～ ${c.signup_end ? formatDateOnly(c.signup_end) : '額滿為止'}</div>
                          <div>📜 <b>結訓證照時數：</b>${c.certificate_hours || 0} 小時 (${c.certificate_action === 'upgrade_role' ? '結訓自動升級權限' : '發放證書'})</div>
                          <div>🚫 <b>取消政策：</b>${c.allow_cancel === 'Y' ? '允許學員自行取消' : '不允許線上取消'}</div>
                          ${c.location_url ? `<div>🔗 <b>線上會議網址：</b><a href="${c.location_url}" target="_blank" class="text-blue-600 underline font-semibold">點擊前往視訊教室</a></div>` : ''}
                          ${c.remark ? `<div class="pt-1 text-slate-500">💬 <b>備註說明：</b>${c.remark}</div>` : ''}
                        </div>
                      </details>
                    </div>

                    <!-- 報名按鈕 (已報名則鎖定) -->
                    <button onclick="${isEnrolled ? '' : `openSignupModal('${c.course_id}', '${c.course_name}', '${date}')`}" 
                      id="btn_${c.course_id}"
                      class="w-full ${btnClass} text-white font-bold py-2.5 rounded-xl text-sm transition shadow-sm"
                      ${isEnrolled ? 'disabled' : ''}>
                      ${btnText}
                    </button>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });
    }

    function openSignupModal(courseId, courseName, courseDate) {
      selectedCourseId = courseId;
      document.getElementById('modal-course-title').textContent = `確認報名：${courseName}`;
      document.getElementById('modal-course-info').textContent = `上課日期：${courseDate}。送出後將由系統進行資格審核與名額分配（若正取額滿將自動轉為候補）。`;
      document.getElementById('signup-modal').classList.remove('hidden');
    }

    function closeSignupModal() {
      selectedCourseId = null;
      document.getElementById('signup-modal').classList.add('hidden');
    }

    // 提交報名 (加入處理中提示與防呆)
    function submitSignup() {
      const session = JSON.parse(localStorage.getItem('session_user') || '{}');
      if (!session.user_id) {
        alert('請先登入系統');
        location.href = 'login.html';
        return;
      }

      const confirmBtn = document.getElementById('confirm-signup-btn');
      const cancelBtn = document.getElementById('modal-cancel-btn');
      confirmBtn.disabled = true;
      cancelBtn.disabled = true;
      confirmBtn.textContent = '⏳ 系統處理中，請稍候...';

      const baseUrl = typeof API_BASE !== 'undefined' ? API_BASE : (typeof API_URL !== 'undefined' ? API_URL : '');
      const callbackName = 'jsonp_signup_' + Math.round(100000 * Math.random());
      
      window[callbackName] = function(res) {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);

        confirmBtn.disabled = false;
        cancelBtn.disabled = false;
        confirmBtn.textContent = '確認送出報名';

        if (res && (res.result === 'ok' || res.result === 'waitlist')) {
          alert(res.message || '報名成功！');
          closeSignupModal();
          loadDataAndCourses();
        } else {
          alert('報名失敗：' + (res ? res.message : '未知錯誤'));
        }
      };

      const script = document.createElement('script');
      script.src = `${baseUrl}?action=enrollCourse&user_id=${session.user_id}&course_id=${selectedCourseId}&callback=${callbackName}`;
      script.onerror = function() {
        delete window[callbackName];
        if (script.parentNode) script.parentNode.removeChild(script);
        confirmBtn.disabled = false;
        cancelBtn.disabled = false;
        confirmBtn.textContent = '確認送出報名';
        alert('網路連線異常，請稍後再試');
      };
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
