<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBT 聯盟線上課程報名</title>
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-800">

  <!-- 導覽列 -->
  <header class="bg-slate-900 text-white p-4 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">BBT 聯盟教育訓練系統</h1>
      <a href="my_courses.html" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition">我的課程 / 報名紀錄</a>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-6xl mx-auto p-6">
    <div class="mb-6">
      <h2 class="text-2xl font-black text-slate-900">近期開課列表</h2>
      <p class="text-sm text-slate-500">請選擇您想報名的課程，額滿將自動轉為候補名單。</p>
    </div>

    <!-- 課程卡片容器 (透過 JS 動態載入) -->
    <div id="course-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- 載入中提示 -->
      <div class="col-span-full text-center py-10 text-slate-400">載入課程中...</div>
    </div>
  </main>

  <!-- 報名確認 Modal -->
  <div id="signup-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
      <h3 id="modal-course-title" class="text-lg font-bold text-slate-900 mb-2">確認報名</h3>
      <p id="modal-course-info" class="text-sm text-slate-600 mb-4"></p>
      <div class="flex justify-end gap-2">
        <button onclick="closeSignupModal()" class="px-4 py-2 rounded-lg border text-slate-600 hover:bg-slate-50 font-semibold text-sm">取消</button>
        <button id="confirm-signup-btn" onclick="submitSignup()" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm">確認送出報名</button>
      </div>
    </div>
  </div>

  <script>
    // 假設你的 GAS Web App 部署網址
    const GAS_API_URL = 'YOUR_GAS_WEB_APP_URL_HERE';
    let selectedCourseId = null;

    document.addEventListener('DOMContentLoaded', () => {
      loadCourses();
    });

    // 1. 載入課程列表
    function loadCourses() {
      // 串接 GAS 取得 Course 資料
      fetch(`${GAS_API_URL}?action=getCourses`)
        .then(res => res.json())
        .then(data => {
          renderCourses(data.courses || []);
        })
        .catch(err => {
          console.error('載入課程失敗', err);
          document.getElementById('course-container').innerHTML = `<div class="col-span-full text-center text-rose-500">載入課程失敗，請稍後再試。</div>`;
        });
    }

    // 2. 渲染課程卡片
    function renderCourses(courses) {
      const container = document.getElementById('course-container');
      if (!courses.length) {
        container.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400">目前無開放報名的課程</div>`;
        return;
      }

      container.innerHTML = courses.map(c => `
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-start mb-2">
              <span class="px-2.5 py-1 text-xs font-bold rounded-md bg-blue-50 text-blue-700 border border-blue-100">${c.course_type}</span>
              <span class="text-xs font-semibold text-slate-400">時數: ${c.training_hours}hr</span>
            </div>
            <h3 class="text-lg font-bold text-slate-900 mb-1">${c.course_name}</h3>
            <p class="text-xs text-slate-500 mb-4">講師：${c.instructor || '未指定'}</p>
            
            <div class="space-y-1.5 text-sm text-slate-600 mb-4">
              <div>📅 日期：${c.date}</div>
              <div>📍 地點：${c.location}</div>
              <div>💰 費用：${c.fee == 0 ? '免費' : 'NT$ ' + c.fee}</div>
              <div>👥 名額：已報名 ${c.current_enrollment} / 正取 ${c.capacity}</div>
            </div>
          </div>
          
          <button onclick="openSignupModal('${c.course_id}', '${c.course_name}', '${c.date}')" 
            class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-xl text-sm transition">
            立即報名
          </button>
        </div>
      `).join('');
    }

    // 3. 開啟報名 Modal
    function openSignupModal(courseId, courseName, courseDate) {
      selectedCourseId = courseId;
      document.getElementById('modal-course-title').textContent = `確認報名：${courseName}`;
      document.getElementById('modal-course-info').textContent = `上課日期：${courseDate}。送出後將由系統進行資格審核與名額分配。`;
      document.getElementById('signup-modal').classList.remove('hidden');
    }

    function closeSignupModal() {
      selectedCourseId = null;
      document.getElementById('signup-modal').classList.add('hidden');
    }

    // 4. 提交報名 API
    function submitSignup() {
      const session = JSON.parse(localStorage.getItem('session_user') || '{}');
      if (!session.user_id) {
        alert('請先登入系統');
        location.href = 'login.html';
        return;
      }

      const payload = {
        action: 'applyCourse',
        user_id: session.user_id,
        course_id: selectedCourseId
      };

      fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.result === 'ok') {
          alert(res.message || '報名成功！');
          closeSignupModal();
          loadCourses(); // 重新整理列表
        } else {
          alert('報名失敗：' + res.message);
        }
      })
      .catch(err => {
        console.error(err);
        alert('網路連線異常');
      });
    }
  </script>
</body>
</html>
