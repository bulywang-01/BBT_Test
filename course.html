<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBT 聯盟 - 課程大廳與線上報名</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- 共用 CSS -->
  <link rel="stylesheet" href="common.css">

  <style>
    *{ box-sizing:border-box; }
    body{ margin:0; padding:0; background:#f8fafc; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#0f172a; }
    .hidden{ display:none!important; }

    /* Toast */
    .toast{ position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-10px); min-width:280px; max-width:90vw; padding:12px 18px; border-radius:12px; text-align:center; color:#fff; font-size:14px; font-weight:700; box-shadow:0 10px 25px rgba(0,0,0,.15); opacity:0; transition:.25s; z-index:10000; }
    .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
    .toast.success{ background:#16a34a; }
    .toast.error{ background:#dc2626; }
    .toast.warn{ background:#f59e0b; }

    #loadingMask{ position:fixed; inset:0; background:rgba(15,23,42,.3); backdrop-filter:blur(2px); display:flex; justify-content:center; align-items:center; z-index:20000; }
    #loadingMask.hidden{ display:none; }
    .loading-box{ background:#fff; padding:20px 28px; border-radius:16px; font-weight:800; box-shadow:0 10px 30px rgba(0,0,0,.15); display:flex; align-items:center; gap:10px; }

    /* Modal */
    .modal{ position:fixed; inset:0; background:rgba(15,23,42,.5); backdrop-filter:blur(2px); display:flex; justify-content:center; align-items:center; z-index:9999; padding:16px; }
    .modal.hidden{ display:none; }
    .modal-dialog{ width:100%; max-width:680px; background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 25px 50px -12px rgba(0,0,0,.25); max-height:90vh; display:flex; flex-direction:column; }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 antialiased">

  <!-- 動態載入共用 Header -->
  <div id="header-container"></div>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-6">

    <!-- Top Title & Action Bar -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight flex items-center gap-2.5">
          <span>📚</span>
          <span>近期開課列表</span>
        </h1>
        <p class="text-sm text-slate-500 mt-1">請選擇您想報名的培訓課程，正取額滿將自動轉為候補名單。</p>
      </div>

      <div class="flex items-center gap-2.5">
        <button onclick="openMyRegistrations()" class="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-sm shadow-md shadow-amber-500/20 transition cursor-pointer">
          <i data-lucide="clipboard-list" class="w-4 h-4"></i>
          <span>我的課程 / 報名紀錄</span>
        </button>
      </div>
    </div>

    <!-- Filter & Search Bar -->
    <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
      <div class="flex items-center gap-2 overflow-x-auto pb-1 sm:pb-0" id="typeFilters">
        <button onclick="setTypeFilter('all')" data-type="all" class="filter-btn active px-3.5 py-1.5 rounded-xl text-xs font-extrabold bg-slate-900 text-white transition whitespace-nowrap">全部課程</button>
        <button onclick="setTypeFilter('judge')" data-type="judge" class="filter-btn px-3.5 py-1.5 rounded-xl text-xs font-extrabold bg-slate-100 text-slate-600 hover:bg-slate-200 transition whitespace-nowrap">🧑‍⚖️ 裁判培訓</button>
        <button onclick="setTypeFilter('record')" data-type="record" class="filter-btn px-3.5 py-1.5 rounded-xl text-xs font-extrabold bg-slate-100 text-slate-600 hover:bg-slate-200 transition whitespace-nowrap">📝 紀錄培訓</button>
        <button onclick="setTypeFilter('general')" data-type="general" class="filter-btn px-3.5 py-1.5 rounded-xl text-xs font-extrabold bg-slate-100 text-slate-600 hover:bg-slate-200 transition whitespace-nowrap">🎓 通識教育</button>
      </div>

      <div class="relative w-full sm:w-64">
        <input id="searchInput" type="text" oninput="renderCourses()" placeholder="搜尋課程名稱、講師、地點..." class="w-full pl-9 pr-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
      </div>
    </div>

    <!-- Courses Container (Grouped by Date) -->
    <div id="coursesContainer" class="space-y-8">
      <div class="text-center py-12 text-slate-400 font-bold">載入課程資料中...</div>
    </div>

  </main>

  <!-- 報名確認 Modal -->
  <div id="signupModal" class="modal hidden">
    <div class="modal-dialog max-w-md">
      <div class="px-5 py-4 bg-slate-900 text-white flex items-center justify-between">
        <h3 class="font-extrabold text-base flex items-center gap-2">
          <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>
          <span>確認課程報名</span>
        </h3>
        <button onclick="closeModal('signupModal')" class="text-slate-400 hover:text-white p-1 rounded-lg">✕</button>
      </div>
      
      <form id="signupForm" onsubmit="submitSignup(event)" class="p-5 space-y-4 overflow-y-auto">
        <input type="hidden" id="signupCourseId">
        
        <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-1.5">
          <div id="modalCourseName" class="font-black text-slate-900 text-base">-</div>
          <div id="modalCourseMeta" class="text-xs text-slate-600 space-y-1"></div>
        </div>

        <div class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">報名人姓名 <span class="text-rose-500">*</span></label>
            <input type="text" id="signupName" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl bg-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">聯絡電話 <span class="text-rose-500">*</span></label>
            <input type="tel" id="signupPhone" required placeholder="09xx-xxx-xxx" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl bg-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">電子信箱 (接收行前通知用)</label>
            <input type="email" id="signupEmail" placeholder="example@email.com" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl bg-white focus:outline-none focus:border-blue-500">
          </div>

          <!-- 動態欄位：匯款後五碼 (若費用 > 0 時顯示) -->
          <div id="fieldPaymentSection" class="hidden">
            <label class="block text-xs font-bold text-slate-700 mb-1">匯款帳號後五碼 <span class="text-rose-500">*</span></label>
            <input type="text" id="signupAtm" maxlength="5" placeholder="請輸入您的轉帳帳號後五碼" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl bg-white focus:outline-none focus:border-blue-500">
          </div>

          <!-- 動態欄位：飲食習慣 (若課程有提供餐點時顯示) -->
          <div id="fieldMealSection" class="hidden">
            <label class="block text-xs font-bold text-slate-700 mb-1">飲食習慣 / 餐點需求</label>
            <select id="signupMeal" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl bg-white focus:outline-none focus:border-blue-500">
              <option value="葷食">葷食（正常）</option>
              <option value="素食">素食</option>
              <option value="不吃牛">不吃牛</option>
              <option value="其他">其他（請於備註說明）</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">備註事項 (選填)</label>
            <input type="text" id="signupNote" placeholder="其他需要特別交代的事項..." class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl bg-white focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <div class="pt-2 flex justify-end gap-2.5">
          <button type="button" onclick="closeModal('signupModal')" class="px-4 py-2 rounded-xl border border-slate-300 text-slate-700 font-bold text-sm hover:bg-slate-50">取消</button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-sm shadow-md shadow-blue-600/20">確認送出報名</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 我的報名紀錄 Modal -->
  <div id="myRecordsModal" class="modal hidden">
    <div class="modal-dialog">
      <div class="px-5 py-4 bg-slate-900 text-white flex items-center justify-between">
        <h3 class="font-extrabold text-base flex items-center gap-2">
          <i data-lucide="bookmark-check" class="w-5 h-5 text-amber-400"></i>
          <span>我的課程 / 報名紀錄</span>
        </h3>
        <button onclick="closeModal('myRecordsModal')" class="text-slate-400 hover:text-white p-1 rounded-lg">✕</button>
      </div>
      
      <div id="myRecordsBody" class="p-5 overflow-y-auto space-y-3 min-h-[200px]">
        <div class="text-center py-8 text-slate-400 font-bold">載入報名紀錄中...</div>
      </div>

      <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-200 flex justify-end">
        <button onclick="closeModal('myRecordsModal')" class="px-4 py-2 rounded-xl bg-slate-800 text-white font-bold text-sm hover:bg-slate-700">關閉視窗</button>
      </div>
    </div>
  </div>

  <!-- Loading Mask -->
  <div id="loadingMask" class="hidden">
    <div class="loading-box">
      <span class="animate-spin text-xl">⏳</span>
      <span id="loadingText">處理中...</span>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/config.js"></script>
  <script>
    let allCourses = [];
    let myRegistrations = [];
    let currentFilter = 'all';
    let currentUser = {};

    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') lucide.createIcons();
      initSession();
      loadHeader();
      loadInitialData();
    });

    function initSession() {
      currentUser = (typeof getSession === 'function') ? getSession() : JSON.parse(localStorage.getItem('session_user') || '{}');
      if (currentUser && currentUser.role) {
        const roles = currentUser.role.split(',').map(r => r.trim());
        if (roles.includes('admin')) document.body.classList.add('role-admin');
        if (roles.includes('judge') || roles.includes('chief_judge')) document.body.classList.add('role-judge');
        if (roles.includes('record') || roles.includes('record_chief')) document.body.classList.add('role-record');
      }
    }

    function loadHeader() {
      fetch('header.html')
        .then(res => res.text())
        .then(html => {
          document.getElementById('header-container').innerHTML = html;
          const userEl = document.getElementById('header-username');
          if (userEl && currentUser && currentUser.name) {
            userEl.textContent = currentUser.name;
          }
        })
        .catch(err => console.error('Header 載入失敗', err));
    }

    function showLoading(msg = '處理中...') {
      document.getElementById('loadingText').textContent = msg;
      document.getElementById('loadingMask').classList.remove('hidden');
    }

    function hideLoading() {
      document.getElementById('loadingMask').classList.add('hidden');
    }

    function showToast(msg, type = 'success') {
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => t.classList.add('show'), 10);
      setTimeout(() => {
        t.classList.remove('show');
        setTimeout(() => t.remove(), 300);
      }, 2500);
    }

    function setTypeFilter(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.type === type) {
          btn.className = 'filter-btn active px-3.5 py-1.5 rounded-xl text-xs font-extrabold bg-slate-900 text-white transition whitespace-nowrap';
        } else {
          btn.className = 'filter-btn px-3.5 py-1.5 rounded-xl text-xs font-extrabold bg-slate-100 text-slate-600 hover:bg-slate-200 transition whitespace-nowrap';
        }
      });
      renderCourses();
    }

    // 同步載入課程與使用者的報名紀錄，以便即時判斷按鈕狀態
    function loadInitialData() {
      showLoading('載入課程與報名狀態...');
      const baseUrl = typeof API_BASE !== 'undefined' ? API_BASE : (typeof API_URL !== 'undefined' ? API_URL : '');
      const userId = currentUser.user_id || currentUser.id || '';
      const userName = currentUser.name || '';

      const cb = 'jsonp_init_data_' + Math.round(100000 * Math.random());

      // 這裡我們平行發送或先抓課程再抓紀錄，最穩妥的方式是兩者都用 JSONP 載入
      loadCoursesAndRegistrations(baseUrl);
    }

    function loadCoursesAndRegistrations(baseUrl) {
      // 先取得報名紀錄，再取得課程列表
      const userId = currentUser.user_id || currentUser.id || '';
      const userName = currentUser.name || '';

      const cbReg = 'jsonp_my_courses_' + Math.round(100000 * Math.random());
      window[cbReg] = function(res) {
        delete window[cbReg];
        if (res && res.result === 'ok') {
          myRegistrations = res.data || [];
        }
        fetchCourses(baseUrl);
      };

      const scriptReg = document.createElement('script');
      scriptReg.src = `${baseUrl}?action=getMyEnrollments&user_id=${encodeURIComponent(userId)}&name=${encodeURIComponent(userName)}&callback=${cbReg}`;
      scriptReg.onerror = function() {
        delete window[cbReg];
        if (scriptReg.parentNode) scriptReg.parentNode.removeChild(scriptReg);
        fetchCourses(baseUrl); // 就算報名紀錄失敗也繼續載入課程
      };
      document.body.appendChild(scriptReg);
    }

    function fetchCourses(baseUrl) {
      const cb = 'jsonp_lobby_courses_' + Math.round(100000 * Math.random());

      window[cb] = function(res) {
        delete window[cb];
        if (script.parentNode) script.parentNode.removeChild(script);
        hideLoading();
        if (res && res.result === 'ok') {
          allCourses = (res.data || []).filter(c => c.course_status !== 'closed');
          renderCourses();
        } else {
          showToast(res ? res.message : '無法取得課程列表', 'error');
        }
      };

      const script = document.createElement('script');
      script.src = `${baseUrl}?action=getCourses&callback=${cb}`;
      script.onerror = function() {
        delete window[cb];
        if (script.parentNode) script.parentNode.removeChild(script);
        hideLoading();
        showToast('網路連線失敗，請稍後再試', 'error');
      };
      document.body.appendChild(script);
    }

    function renderCourses() {
      const container = document.getElementById('coursesContainer');
      const keyword = (document.getElementById('searchInput').value || '').toLowerCase();

      const filtered = allCourses.filter(c => {
        const matchType = currentFilter === 'all' || c.course_type === currentFilter;
        const text = [c.course_name, c.instructor, c.location].join(' ').toLowerCase();
        const matchKw = !keyword || text.includes(keyword);
        return matchType && matchKw;
      });

      if (!filtered.length) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 p-12 text-center space-y-2">
            <div class="text-4xl">📭</div>
            <div class="font-extrabold text-slate-700 text-base">目前沒有符合條件的開課資訊</div>
            <div class="text-xs text-slate-400">請嘗試切換分類或清除搜尋關鍵字</div>
          </div>`;
        return;
      }

      // 依開課日期分組
      const grouped = {};
      filtered.forEach(c => {
        const d = c.date ? c.date.split('T')[0] : '日期未定';
        if (!grouped[d]) grouped[d] = [];
        grouped[d].push(c);
      });

      container.innerHTML = '';
      Object.keys(grouped).sort().forEach(dateKey => {
        const list = grouped[dateKey];
        const groupSection = document.createElement('section');
        groupSection.className = 'space-y-4';

        groupSection.innerHTML = `
          <div class="flex items-center gap-2 pb-2 border-b border-slate-200">
            <span class="text-lg">📅</span>
            <h2 class="font-black text-slate-800 text-lg">${dateKey}</h2>
            <span class="text-xs font-bold text-slate-400">（共 ${list.length} 門課程）</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            ${list.map(c => buildCourseCard(c)).join('')}
          </div>
        `;
        container.appendChild(groupSection);
      });

      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function buildCourseCard(c) {
      const typeLabel = c.course_type === 'judge' ? 'judge' : (c.course_type === 'record' ? 'record' : 'general');
      const typeBadgeColor = c.course_type === 'judge' ? 'bg-blue-100 text-blue-700' : (c.course_type === 'record' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-700');
      
      const enrolled = Number(c.current_enrollment) || 0;
      const cap = Number(c.capacity) || 30;
      const waitCap = Number(c.waitlist_capacity) || 0;
      const isFull = enrolled >= cap;

      // 檢查使用者是否已經報名過此課程
      const existingReg = myRegistrations.find(r => String(r.course_id) === String(c.course_id) && r.status !== 'cancelled');

      let actionButtonHtml = '';
      if (existingReg) {
        if (existingReg.status === 'waitlist') {
          actionButtonHtml = `<button onclick="openMyRegistrations()" class="w-full py-3 rounded-xl bg-amber-100 text-amber-800 border border-amber-300 font-extrabold text-sm shadow-sm transition cursor-pointer hover:bg-amber-200">⏳ 已在候補名單（點此查看）</button>`;
        } else {
          actionButtonHtml = `<button onclick="openMyRegistrations()" class="w-full py-3 rounded-xl bg-emerald-100 text-emerald-800 border border-emerald-300 font-extrabold text-sm shadow-sm transition cursor-pointer hover:bg-emerald-200">✅ 您已成功報名（點此查看紀錄）</button>`;
        }
      } else {
        if (isFull) {
          actionButtonHtml = `<button onclick="openSignupModal('${c.course_id}')" class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-extrabold text-sm shadow-sm transition cursor-pointer">正取已滿・登記候補</button>`;
        } else {
          actionButtonHtml = `<button onclick="openSignupModal('${c.course_id}')" class="w-full py-3 rounded-xl bg-slate-900 hover:bg-blue-600 text-white font-extrabold text-sm shadow-sm transition cursor-pointer">立即報名</button>`;
        }
      }

      return `
        <article class="bg-white rounded-2xl border border-slate-200/90 shadow-sm hover:shadow-md transition p-5 flex flex-col justify-between space-y-4">
          <div class="space-y-3">
            <!-- Top Badges & Hours -->
            <div class="flex items-center justify-between gap-2">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="px-2.5 py-0.5 rounded-full text-xs font-extrabold ${typeBadgeColor}">${typeLabel}</span>
                ${c.certificate_type ? `<span class="px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-purple-100 text-purple-700">證照 : ${c.certificate_type} ${c.certificate_level || ''}</span>` : ''}
              </div>
              <span class="text-xs font-bold text-slate-500">培訓時數 : ${c.training_hours || 0}hr</span>
            </div>

            <!-- Title & Instructor -->
            <div>
              <h3 class="text-xl font-black text-slate-900 leading-snug">${c.course_name || '未命名課程'}</h3>
              <p class="text-xs font-bold text-slate-500 mt-1 flex items-center gap-1.5">
                <span>👨‍🏫 講師：${c.instructor || '依聯盟公告'}</span>
              </p>
            </div>

            <!-- Info Box -->
            <div class="bg-slate-50/90 rounded-xl p-3.5 border border-slate-200/70 space-y-2 text-xs text-slate-700">
              <div class="flex items-center gap-2">
                <span>📅</span>
                <span class="font-bold">日期：</span>
                <span>${c.date ? c.date.split('T')[0] : '未定'}${c.end_date && c.end_date !== c.date ? ' ~ ' + c.end_date.split('T')[0] : ''}</span>
              </div>
              <div class="flex items-center gap-2">
                <span>⏰</span>
                <span class="font-bold">時間：</span>
                <span>${c.time || '依課程公告為準'}</span>
              </div>
              <div class="flex items-center gap-2">
                <span>📍</span>
                <span class="font-bold">地點：</span>
                <span>${c.location || '實體 / 線上同步'}</span>
              </div>
              <div class="flex items-center gap-2">
                <span>💰</span>
                <span class="font-bold">費用：</span>
                <span class="font-extrabold text-slate-900">${Number(c.fee) === 0 ? '免費' : 'NT$ ' + c.fee}</span>
              </div>
              <div class="flex items-center gap-2">
                <span>👥</span>
                <span class="font-bold">名額：</span>
                <span>已報名 <strong>${enrolled}</strong> / 正取 ${cap} ${waitCap > 0 ? `(候補上限 ${waitCap})` : ''}</span>
              </div>
            </div>

            <!-- Collapsible Details -->
            <details class="group bg-slate-50 rounded-xl border border-slate-200/70">
              <summary class="px-3.5 py-2.5 text-xs font-bold text-slate-600 cursor-pointer flex items-center justify-between list-none">
                <span>🔍 檢視完整課程與報名規定細節</span>
                <span class="transition-transform group-open:rotate-180">▼</span>
              </summary>
              <div class="px-3.5 pb-3 pt-1 text-xs text-slate-600 space-y-1.5 border-t border-slate-200/60">
                <div><strong>報名資格：</strong>${c.signup_type === 'member_only' ? '限系統會員' : (c.signup_type === 'licensed_only' ? '限具備相關證照者' : '公開報名')}</div>
                <div><strong>報名期間：</strong>${c.signup_start ? c.signup_start.split('T')[0] : '即日起'} ~ ${c.signup_end ? c.signup_end.split('T')[0] : '額滿為止'}</div>
                <div><strong>認證時數：</strong>${c.certificate_hours || '依結訓標準核發'}</div>
                ${c.location_url ? `<div><strong>線上連結：</strong><a href="${c.location_url}" target="_blank" class="text-blue-600 underline">點此開啟會議室</a></div>` : ''}
                ${c.remark ? `<div class="text-amber-700 bg-amber-50 p-2 rounded-lg mt-1"><strong>備註：</strong>${c.remark}</div>` : ''}
              </div>
            </details>
          </div>

          <!-- Action Button -->
          <div class="pt-1">
            ${actionButtonHtml}
          </div>
        </article>
      `;
    }

    function openSignupModal(courseId) {
      const c = allCourses.find(x => String(x.course_id) === String(courseId));
      if (!c) return;

      document.getElementById('signupCourseId').value = c.course_id;
      document.getElementById('modalCourseName').textContent = c.course_name;
      document.getElementById('modalCourseMeta').innerHTML = `
        <div>📅 日期：${c.date ? c.date.split('T')[0] : '未定'} (${c.time || '依公告'})</div>
        <div>📍 地點：${c.location || '-'} ｜ 💰 費用：${Number(c.fee) === 0 ? '免費' : 'NT$ ' + c.fee}</div>
      `;

      // 智慧動態顯示：若費用 > 0，顯示匯款後五碼欄位
      const paySection = document.getElementById('fieldPaymentSection');
      const atmInput = document.getElementById('signupAtm');
      if (Number(c.fee) > 0) {
        paySection.classList.remove('hidden');
        atmInput.required = true;
      } else {
        paySection.classList.add('hidden');
        atmInput.required = false;
        atmInput.value = '';
      }

      // 智慧動態顯示：若備註或名稱含有餐點關鍵字、或時數 >= 4小時，自動顯示飲食習慣欄位供選擇
      const mealSection = document.getElementById('fieldMealSection');
      const isLongTraining = (Number(c.training_hours) || 0) >= 4;
      const hasMealRemark = (c.remark && (c.remark.includes('餐') || c.remark.includes('便當') || c.remark.includes('飲食')));
      if (isLongTraining || hasMealRemark || Number(c.fee) > 0) {
        mealSection.classList.remove('hidden');
      } else {
        mealSection.classList.add('hidden');
      }

      // 若已登入，自動帶入會員資料
      if (currentUser && currentUser.name) {
        document.getElementById('signupName').value = currentUser.name || '';
        document.getElementById('signupPhone').value = currentUser.phone || '';
        document.getElementById('signupEmail').value = currentUser.email || '';
      }

      document.getElementById('signupModal').classList.remove('hidden');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function submitSignup(e) {
      e.preventDefault();
      showLoading('送出報名資料中...');

      const payload = {
        course_id: document.getElementById('signupCourseId').value,
        user_id: currentUser.user_id || currentUser.id || '',
        name: document.getElementById('signupName').value.trim(),
        phone: document.getElementById('signupPhone').value.trim(),
        email: document.getElementById('signupEmail').value.trim(),
        atm_tail: document.getElementById('signupAtm').value.trim(),
        meal_preference: document.getElementById('signupMeal').value,
        note: document.getElementById('signupNote').value.trim()
      };

      const baseUrl = typeof API_BASE !== 'undefined' ? API_BASE : (typeof API_URL !== 'undefined' ? API_URL : '');
      const cb = 'jsonp_signup_' + Math.round(100000 * Math.random());
      const params = new URLSearchParams({
        action: 'enrollCourse',
        callback: cb,
        ...payload
      });

      window[cb] = function(res) {
        delete window[cb];
        if (script.parentNode) script.parentNode.removeChild(script);
        hideLoading();
        if (res && res.result === 'ok') {
          showToast('🎉 報名成功！您已成功登記此課程', 'success');
          closeModal('signupModal');
          loadInitialData(); // 重新載入以更新按鈕狀態
        } else {
          showToast('❌ 報名失敗：' + (res ? res.message : '請確認是否重複報名'), 'error');
        }
      };

      const script = document.createElement('script');
      script.src = `${baseUrl}?${params.toString()}`;
      script.onerror = function() {
        delete window[cb];
        if (script.parentNode) script.parentNode.removeChild(script);
        hideLoading();
        showToast('網路連線異常，請稍後重試', 'error');
      };
      document.body.appendChild(script);
    }

    function openMyRegistrations() {
      document.getElementById('myRecordsModal').classList.remove('hidden');
      const body = document.getElementById('myRecordsBody');
      
      const userId = currentUser.user_id || currentUser.id || '';
      const userName = currentUser.name || '';
      if (!userId && !userName) {
        body.innerHTML = `<div class="text-center py-8 text-slate-500 font-bold">請先登入系統後再查詢個人報名紀錄</div>`;
        return;
      }

      body.innerHTML = `<div class="text-center py-8 text-slate-400 font-bold">查詢中...</div>`;
      const baseUrl = typeof API_BASE !== 'undefined' ? API_BASE : (typeof API_URL !== 'undefined' ? API_URL : '');
      const cb = 'jsonp_my_courses_' + Math.round(100000 * Math.random());

      window[cb] = function(res) {
        delete window[cb];
        if (script.parentNode) script.parentNode.removeChild(script);
        if (res && res.result === 'ok') {
          myRegistrations = res.data || [];
          renderMyRecords();
          renderCourses(); // 同步刷新主畫面按鈕
        } else {
          body.innerHTML = `<div class="text-center py-8 text-rose-500 font-bold">${res ? res.message : '無法取得報名紀錄'}</div>`;
        }
      };

      const script = document.createElement('script');
      script.src = `${baseUrl}?action=getMyEnrollments&user_id=${encodeURIComponent(userId)}&name=${encodeURIComponent(userName)}&callback=${cb}`;
      script.onerror = function() {
        delete window[cb];
        if (script.parentNode) script.parentNode.removeChild(script);
        body.innerHTML = `<div class="text-center py-8 text-rose-500 font-bold">網路連線異常</div>`;
      };
      document.body.appendChild(script);
    }

    function renderMyRecords() {
      const body = document.getElementById('myRecordsBody');
      if (!myRegistrations.length) {
        body.innerHTML = `<div class="text-center py-10 text-slate-400 font-bold">尚無任何課程報名紀錄</div>`;
        return;
      }

      body.innerHTML = myRegistrations.map(r => {
        const isWaitlist = r.status === 'waitlist';
        const statusBadge = isWaitlist 
          ? `<span class="px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-amber-100 text-amber-800">候補名單</span>`
          : `<span class="px-2.5 py-0.5 rounded-full text-xs font-extrabold bg-emerald-100 text-emerald-800">正取錄取</span>`;

        return `
          <div class="p-4 rounded-xl border border-slate-200 bg-slate-50/70 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="font-black text-slate-900 text-sm">${r.course_name || '課程名稱'}</span>
                ${statusBadge}
              </div>
              <div class="text-xs text-slate-600">📅 上課日期：${r.date ? r.date.split('T')[0] : '-'} ｜ 📍 ${r.location || '-'}</div>
              <div class="text-xs text-slate-500">💰 繳費狀態：${r.payment_status === 'paid' ? '<span class="text-emerald-600 font-bold">已繳費</span>' : '<span class="text-amber-600 font-bold">待確認 / 現場繳費</span>'}</div>
            </div>
            ${r.allow_cancel !== 'N' ? `
              <button onclick="cancelEnrollment('${r.enrollment_id || r.course_id}', '${r.course_name}')" class="px-3 py-1.5 rounded-xl border border-rose-200 bg-rose-50 text-rose-600 hover:bg-rose-100 text-xs font-bold self-start sm:self-center transition">取消報名</button>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function cancelEnrollment(targetId, courseName) {
      if (!confirm(`確定要取消「${courseName}」的報名嗎？`)) return;
      showLoading('取消報名中...');
      const baseUrl = typeof API_BASE !== 'undefined' ? API_BASE : (typeof API_URL !== 'undefined' ? API_URL : '');
      const cb = 'jsonp_cancel_enroll_' + Math.round(100000 * Math.random());

      window[cb] = function(res) {
        delete window[cb];
        if (script.parentNode) script.parentNode.removeChild(script);
        hideLoading();
        if (res && res.result === 'ok') {
          showToast('已成功取消報名', 'success');
          openMyRegistrations();
          loadInitialData(); // 重新載入以刷新按鈕狀態
        } else {
          showToast(res ? res.message : '取消失敗', 'error');
        }
      };

      const script = document.createElement('script');
      script.src = `${baseUrl}?action=cancelEnrollment&id=${encodeURIComponent(targetId)}&user_id=${encodeURIComponent(currentUser.user_id || '')}&callback=${cb}`;
      script.onerror = function() {
        delete window[cb];
        if (script.parentNode) script.parentNode.removeChild(script);
        hideLoading();
        showToast('網路連線異常', 'error');
      };
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
